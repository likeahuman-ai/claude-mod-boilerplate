<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent orbit tutorial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Space+Grotesk:wght@600&family=Space+Mono:ital@0;1&display=swap" rel="stylesheet">
<style>
/* Like A Human design law, dark mode (packages/dls/design/DESIGN.md). */
:root {
  --background: #08142A;          /* layer 1 */
  --surface: #0F1F38;             /* layer 2: card, panel */
  --popover: #15294A;             /* layer 3: raised, popover */
  --zone: #12345A;                /* a calm band */
  --muted-hover: #1F3D66;
  --code-ground: #0D2240;
  --code-foreground: #EAF1F8;
  --foreground: #C7D4E2;
  --heading: #EAF1F8;
  --muted-foreground: #9FB3C8;
  --border: rgb(255 255 255 / 12%);
  --border-strong: rgb(255 255 255 / 18%);
  --border-input: rgb(255 255 255 / 30%);
  --gold: #D4A64A;
  --lime: #DEFEB3;                /* scarce: at most two elements per view */
  --on-lime: #1C2B3A;
  --read: #A3D2FF;                /* link / reads */
  --act: #E4C57E;                 /* warning-text / actions */
  --done: #7FC79A;                /* success / done */
  --info-text: #8FBCE4;
  --info-tint: rgb(59 130 196 / 15%);
  --warning-tint: rgb(212 166 74 / 15%);
  --top-light: inset 0 1px 0 rgb(255 255 255 / 6%);
  --shadow-card: 0 1px 2px rgb(9 26 51 / 40%), 0 8px 20px -8px rgb(9 26 51 / 60%);
  --shadow-float: 0 2px 4px rgb(9 26 51 / 50%), 0 16px 24px -8px rgb(9 26 51 / 60%), 0 40px 64px -24px rgb(9 26 51 / 70%);
  --body: 'Montserrat', ui-sans-serif, system-ui, sans-serif;
  --ui: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
  --mono: 'Space Mono', ui-monospace, Menlo, monospace;
  --ease: cubic-bezier(0.32, 0.72, 0, 1);
  --t-in: 250ms;
  --t-enter: 400ms;
  /* type steps for a 900 px high screen; a taller screen takes the next step */
  --fs-title: 32px; --fs-lead: 16px; --fs-note: 14px; --fs-hero: 48px; --fs-num: 48px;
}
@media (min-height: 1000px) {
  :root { --fs-lead: 18px; --fs-note: 16px; --fs-hero: 56px; --fs-num: 64px; }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--background);
  color: var(--foreground);
  font-family: var(--body);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
.app {
  position: relative;
  height: 100vh;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: 16px 32px 12px;
  gap: 16px;
}
.eyebrow { font: 400 12px/1.3 var(--mono); letter-spacing: 2px; text-transform: uppercase; color: var(--gold); }

/* ---------- top: the mark, the title and the rail ---------- */
header { display: flex; align-items: center; gap: 32px; min-height: 48px; }
.brand { display: flex; align-items: center; gap: 16px; white-space: nowrap; }
.mark { display: inline-flex; align-items: center; gap: 8px; font: 700 16px/1 var(--body); color: var(--heading); }
.mark i { width: 8px; height: 8px; border-radius: 50%; background: var(--lime); }
.brand h1 { font: 600 14px/1.3 var(--body); letter-spacing: .15px; color: var(--foreground); padding-left: 16px; border-left: 1px solid var(--border-strong); }
.rail { flex: 1; display: grid; grid-template-columns: repeat(7, 1fr); position: relative; transition: opacity var(--t-in) var(--ease); }
.rail::before { content: ''; position: absolute; left: 0; right: 0; top: 6px; height: 1px; background: var(--border-strong); }
.rail .fill { position: absolute; left: 0; top: 6px; height: 1px; background: var(--border-input); transition: width var(--t-enter) var(--ease); }
.rail button {
  position: relative; background: none; border: 0; color: var(--muted-foreground); cursor: pointer;
  font: 600 12px/1.3 var(--ui); text-align: left; padding: 24px 8px 0 0;
  transition: color var(--t-in) var(--ease);
}
.rail button::before {
  content: ''; position: absolute; left: 0; top: 0; width: 12px; height: 12px; border-radius: 50%;
  background: var(--background); border: 1px solid var(--border-input); transition: all var(--t-in) var(--ease);
}
.rail button b { font: 400 12px var(--mono); color: var(--gold); margin-right: 6px; }
.rail button:hover { color: var(--heading); }
.rail button.past::before { background: var(--muted-foreground); border-color: var(--muted-foreground); }
.rail button.on { color: var(--heading); }
.rail button.on::before { background: var(--heading); border-color: var(--heading); box-shadow: 0 0 0 4px rgb(255 255 255 / 12%); }
:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }
.rail button:focus-visible { border-radius: 8px; }

/* ---------- the two halves ---------- */
main { min-height: 0; display: grid; grid-template-columns: 57fr 43fr; gap: 32px; }
.stage { position: relative; min-height: 0; }
.panel { position: relative; min-height: 0; display: flex; flex-direction: column; transition: opacity var(--t-enter) var(--ease); }
footer { display: flex; justify-content: space-between; align-items: center; font: 400 12px var(--body); color: var(--muted-foreground); }
footer kbd { font: 600 12px/20px var(--ui); color: var(--heading); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 0 6px; display: inline-block; }
.clock { font: 400 12px var(--mono); color: var(--muted-foreground); }
.clock i { font-style: normal; color: var(--heading); }

/* intro and live: the orbit takes the whole width */
body.intro main { grid-template-columns: 1fr 0fr; gap: 0; }
body.intro .panel { opacity: 0; pointer-events: none; }

/* ---------- windows ---------- */
.view { position: absolute; inset: 0; display: flex; flex-direction: column; }
.view.enter { animation: viewIn var(--t-enter) var(--ease) both; }
@keyframes viewIn { from { opacity: 0; transform: translateY(8px); filter: blur(2px); } to { opacity: 1; transform: none; filter: none; } }
.win {
  flex: 1; min-height: 0; display: flex; flex-direction: column;
  background: var(--code-ground); border: 1px solid var(--border); border-radius: 20px; overflow: hidden;
  box-shadow: var(--top-light), var(--shadow-card);
}
.bar {
  flex: none; height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 16px;
  background: var(--surface); border-bottom: 1px solid var(--border); box-shadow: var(--top-light);
  font: 600 12px var(--ui); color: var(--muted-foreground);
}
.bar .dots { display: flex; gap: 6px; margin-right: 12px; }
.bar .dots i { width: 12px; height: 12px; border-radius: 50%; background: var(--border-strong); }
.bar .grow { flex: 1; text-align: center; margin-right: 64px; }
.body { flex: 1; min-height: 0; display: grid; grid-template-columns: 33fr 67fr; }

/* the chat column, CLI style */
.chat {
  min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end;
  padding: 16px 16px 12px; gap: 12px; border-right: 1px solid var(--border);
  font: 400 12px/1.5 var(--mono); color: var(--code-foreground);
}
.chat .head { margin-bottom: auto; color: var(--muted-foreground); border: 1px solid var(--border); border-radius: 12px; padding: 8px 12px; }
.chat .head b { color: var(--heading); font-weight: 400; }
.msg { animation: msgIn var(--t-enter) var(--ease) both; }
@keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.msg.user { color: var(--heading); background: var(--surface); border-radius: 8px; padding: 6px 8px; }
.msg.user::before { content: '> '; color: var(--muted-foreground); }
.msg .mark { color: var(--heading); }
.msg.agent .mark.run { color: var(--act); animation: blink 1s steps(2) infinite; }
.msg.agent .mark.done { color: var(--done); }
.msg.agent .sub { color: var(--muted-foreground); padding-left: 2ch; }
.msg.plugin { border: 1px solid var(--border-strong); border-radius: 12px; padding: 8px 12px; background: var(--info-tint); white-space: pre-wrap; }
.msg.plugin .who { color: var(--info-text); display: block; margin-bottom: 4px; }
.msg.claude { white-space: pre-wrap; }
.prompt { flex: none; border-top: 1px solid var(--border-strong); border-bottom: 1px solid var(--border-strong); padding: 6px 4px; color: var(--muted-foreground); }
.prompt::before { content: '> '; }
.prompt i { display: inline-block; width: .6em; height: 1.1em; vertical-align: -2px; background: var(--muted-foreground); animation: blink 1.1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* the docked pane */
.pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; padding: 12px; transition: opacity var(--t-enter) var(--ease), transform var(--t-enter) var(--ease); }
.pane-title { flex: none; display: flex; justify-content: space-between; font: 600 12px var(--ui); color: var(--muted-foreground); padding: 0 4px 6px; border-bottom: 1px solid var(--border); margin-bottom: 8px; }
.pane-title b { color: var(--heading); font-weight: 600; }
.pane-body { flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; }
.pane.closed { opacity: 0; transform: translateX(24px); }
.hello { font: 400 24px var(--mono); color: var(--code-foreground); }
.hello::after { content: ''; display: inline-block; width: .55em; height: 1em; margin-left: 6px; vertical-align: -3px; background: var(--code-foreground); animation: blink 1.1s steps(2) infinite; }
.cells { position: absolute; }
.cells.bloom { filter: blur(4px); opacity: .45; mix-blend-mode: screen; }

/* step 2: the text rows */
.rows { width: 100%; align-self: flex-start; font: 400 14px/1.5 var(--mono); color: var(--code-foreground); }
.rows .note { color: var(--muted-foreground); margin-bottom: 12px; font-style: italic; }
.rows .row { display: grid; grid-template-columns: 5ch 12ch 7ch 8ch 8ch; gap: 0 1ch; padding: 4px 8px; border-radius: 8px; transition: background var(--t-in) var(--ease); }
.rows .row.flash { background: var(--info-tint); transition: none; }
.rows .row .last { grid-column: 2 / -1; color: var(--muted-foreground); font-size: 12px; }
.rows .runs { color: var(--act); } .rows .done { color: var(--done); }
.rows .n { color: var(--read); } .rows .a { color: var(--act); }

/* desktop app */
.desk .body { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) minmax(0, 24%); background: var(--background); }
.desk .pane { order: 1; }
.desk .chat { order: 2; border-right: 0; border-top: 1px solid var(--border); flex-direction: row; align-items: flex-end; gap: 16px; padding: 12px 16px; background: var(--surface); font: 400 14px/1.5 var(--body); color: var(--foreground); }
.desk .chat .head { display: none; }
.desk .chat .msgs { flex: 1; min-width: 0; max-height: 100%; overflow: hidden; justify-content: flex-end; }
.desk .msg.user { background: var(--popover); color: var(--heading); border-radius: 12px; padding: 8px 12px; margin-left: 16%; }
.desk .msg.user::before { content: none; }
.desk .msg.plugin { font: 400 12px/1.5 var(--mono); color: var(--code-foreground); }
.desk .prompt { flex: none; width: 26%; height: 44px; display: flex; align-items: center; border: 1px solid var(--border-input); border-radius: 12px; padding: 0 16px; font: 400 14px var(--body); }
.desk .prompt::before { content: 'Reply to Claude…'; }
.desk .prompt i { display: none; }
.svgwrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.svgwrap svg { width: 100%; height: 100%; display: block; }

/* intro */
.introv { position: absolute; inset: 0; }
.introv .svgwrap { inset: 0 0 0 33%; }
.introv .promise { position: absolute; left: 0; bottom: 8%; max-width: 31%; z-index: 2; }
.introv .eyebrow { margin-bottom: 16px; }
.introv h2 { font: 700 var(--fs-hero)/1.08 var(--body); letter-spacing: -.8px; color: var(--heading); }
.introv p { margin-top: 24px; font: 600 18px/1.5 var(--body); color: var(--muted-foreground); max-width: 32ch; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 24px; border-radius: 100px; cursor: pointer;
  font: 600 16px/1 var(--ui); border: 1px solid var(--border); background: var(--surface); color: var(--heading); box-shadow: var(--top-light);
  transition: background var(--t-in) var(--ease), transform var(--t-in) var(--ease), border-color var(--t-in) var(--ease);
}
.btn:hover { background: var(--muted-hover); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--lime); border-color: var(--lime); color: var(--on-lime); box-shadow: none; }
.btn.primary:hover { background: var(--lime); }
.btn.sm { height: 44px; padding: 0 16px; font-size: 14px; }
.btn:disabled { opacity: .5; cursor: default; }
.introv .btn { margin-top: 32px; }

/* ---------- the panel ---------- */
.pin { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.pin.enter > * { animation: panelIn var(--t-enter) var(--ease) both; }
.pin.enter > *:nth-child(2) { animation-delay: 40ms; } .pin.enter > *:nth-child(3) { animation-delay: 80ms; }
.pin.enter > *:nth-child(4) { animation-delay: 120ms; } .pin.enter > *:nth-child(5) { animation-delay: 160ms; }
@keyframes panelIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.phead { display: flex; align-items: flex-end; gap: 16px; }
.phead .num { font: 400 var(--fs-num)/.85 var(--mono); color: var(--gold); letter-spacing: -.8px; }
.phead .eyebrow { margin-bottom: 8px; }
.phead h2 { font: 700 var(--fs-title)/1.15 var(--body); letter-spacing: -.4px; color: var(--heading); }
.adds { margin-top: 12px; font: 400 var(--fs-lead)/1.5 var(--body); color: var(--foreground); max-width: 60ch; }
.code { margin-top: 12px; flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 8px; --fs: 14px; }
.block { flex: none; min-width: 0; background: var(--code-ground); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.tab { display: flex; align-items: center; gap: 8px; padding: 4px 12px; background: var(--surface); border-bottom: 1px solid var(--border); font: 600 12px var(--ui); color: var(--muted-foreground); }
.pair { flex: none; display: grid; grid-template-columns: 1.3fr 1fr; gap: 8px; align-items: start; }
.tab::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--read); }
.tab.json::before { background: var(--act); }
.tab em { font-style: normal; color: var(--muted-foreground); margin-left: auto; }
pre { margin: 0; padding: 4px 0; font: 400 var(--fs)/1.5 var(--mono); font-variant-ligatures: none; color: var(--code-foreground); tab-size: 2; }
pre .ln { display: grid; grid-template-columns: 3.6ch 1.6ch minmax(0, 1fr); padding-right: 12px; border-left: 2px solid transparent; }
pre .ln .no { text-align: right; color: rgb(255 255 255 / 30%); padding-right: 1ch; user-select: none; }
pre .ln .mk { color: var(--gold); font-size: .85em; }
pre .ln .src { white-space: pre; overflow: hidden; text-overflow: ellipsis; }
pre .ln.hl .src { white-space: pre-wrap; overflow-wrap: anywhere; }
pre .ln.hl { background: var(--info-tint); border-left-color: var(--read); }
pre .ln.hl .no { color: var(--read); }
pre .gap { color: rgb(255 255 255 / 30%); padding-left: 4.5ch; font-size: .85em; line-height: 1.3; }
.t-com { color: var(--muted-foreground); font-style: italic; } .t-str { color: var(--done); } .t-kw { color: var(--read); }
.t-num { color: var(--act); } .t-fn { color: var(--info-text); } .t-dol { color: var(--heading); text-decoration: underline dotted rgb(255 255 255 / 30%); text-underline-offset: 3px; }
.t-tag { color: var(--info-text); } .t-key { color: var(--read); }
.notes { margin-top: 12px; list-style: none; display: grid; gap: 6px; }
.notes li { display: grid; grid-template-columns: 24px 1fr; align-items: baseline; font: 400 var(--fs-note)/1.5 var(--body); color: var(--foreground); }
.notes li b { font: 400 12px/1 var(--mono); color: var(--gold); }
.see { margin-top: 12px; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); box-shadow: var(--top-light); display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: baseline; font: 400 var(--fs-note)/1.5 var(--body); color: var(--heading); }

/* ---------- live mode ---------- */
.badge {
  display: none; align-items: center; gap: 8px; flex: none; height: 32px; padding: 0 12px; border-radius: 100px; cursor: pointer;
  border: 1px solid var(--border); background: var(--surface); box-shadow: var(--top-light);
  color: var(--heading); font: 600 12px var(--ui);
}
.badge.show { display: inline-flex; }
.badge i { width: 8px; height: 8px; border-radius: 50%; background: var(--done); animation: pulse 1600ms var(--ease) infinite; }
.badge.idle { color: var(--muted-foreground); }
.badge.idle i { background: var(--muted-foreground); animation: none; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgb(127 199 154 / 60%); } 70% { box-shadow: 0 0 0 8px rgb(127 199 154 / 0%); } 100% { box-shadow: 0 0 0 0 rgb(127 199 154 / 0%); } }
body.live .rail { display: none; }
.livebox { margin-left: auto; }
.livebox { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.liverow { display: flex; align-items: center; gap: 8px; }
.chips { display: none; gap: 6px; }
body.live .chips { display: flex; }
.sess {
  display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 100px; cursor: pointer;
  border: 1px solid var(--border); background: var(--surface); color: var(--muted-foreground); font: 600 12px var(--ui);
  transition: opacity var(--t-in) var(--ease), background var(--t-in) var(--ease), border-color var(--t-in) var(--ease), color var(--t-in) var(--ease);
}
.sess svg { flex: none; }
.sess .n { font: 400 12px var(--mono); color: var(--act); }
.sess .n.zero { color: var(--muted-foreground); }
.sess.on { background: var(--muted-hover); border-color: var(--border-input); color: var(--heading); }
.sess.stale { opacity: .45; }
.same { display: none; font: 400 12px var(--body); color: var(--muted-foreground); }
body.live .same { display: block; }
.ctl input {
  flex: 1; min-width: 0; height: 44px; padding: 0 16px; border-radius: 100px;
  background: var(--background); border: 1px solid var(--border-input); color: var(--heading); font: 400 14px var(--body);
}
.ctl input::placeholder { color: var(--muted-foreground); }
.livev { display: grid; grid-template-columns: 61fr 39fr; gap: 24px; }
.lorbit { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.lorbit .win .pane { flex: 1; }
.lchat {
  min-width: 0; min-height: 0; display: flex; flex-direction: column;
  background: var(--background); border: 1px solid var(--border); border-radius: 20px; overflow: hidden;
}
.lhead { flex: none; display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--border); box-shadow: var(--top-light); }
.lhead svg { color: var(--muted-foreground); }
.ltitle { font: 700 16px/1.3 var(--body); color: var(--heading); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lmsgs { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 12px; padding: 16px; scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
.lmsgs > :first-child { margin-top: auto; }
.lempty { color: var(--muted-foreground); font: 400 14px/1.5 var(--body); text-align: center; padding: 24px; }
.bub { max-width: 88%; padding: 12px 16px; border-radius: 20px; font: 400 var(--fs-note)/1.5 var(--body); white-space: pre-wrap; overflow-wrap: anywhere; }
.bub.enter { animation: bubIn var(--t-enter) var(--ease) both; }
@keyframes bubIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.bub.you { align-self: flex-end; background: var(--popover); color: var(--heading); border-bottom-right-radius: 8px; }
.bub.plugin { align-self: flex-end; background: transparent; color: var(--heading); border: 1px solid var(--border-strong); border-bottom-right-radius: 8px; }
.bub.pending { color: var(--muted-foreground); border-style: dashed; }
.bub.claude { align-self: flex-start; background: var(--surface); color: var(--foreground); border: 1px solid var(--border); box-shadow: var(--top-light); border-bottom-left-radius: 8px; max-width: 94%; }
.bub .tag, .bub .who { display: block; margin-bottom: 4px; font: 600 12px/1.3 var(--ui); color: var(--muted-foreground); }
.bub .who { color: var(--heading); }
.ctl { flex: none; display: grid; gap: 8px; padding: 12px; background: var(--surface); border-top: 1px solid var(--border); box-shadow: var(--top-light); }
.ctl-row { display: flex; gap: 8px; }
.ctl-row .btn { flex: none; }
.toast {
  position: fixed; left: 50%; bottom: 112px; transform: translate(-50%, 8px); opacity: 0; z-index: 10;
  display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; border-radius: 100px;
  background: var(--popover); border: 1px solid var(--border); box-shadow: var(--top-light), var(--shadow-float);
  color: var(--heading); font: 600 14px var(--ui);
  transition: opacity var(--t-enter) var(--ease), transform var(--t-enter) var(--ease); pointer-events: none;
}
.toast::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--done); }
.toast.err { background: var(--warning-tint); color: var(--act); }
.toast.err::before { background: var(--act); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.wait { position: absolute; left: 50%; top: 12%; transform: translateX(-50%); font: 600 14px var(--ui); color: var(--muted-foreground); background: var(--popover); border: 1px solid var(--border); border-radius: 100px; padding: 8px 16px; animation: breathe 1600ms cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; }
@keyframes breathe { to { opacity: .55; } }
.wait[hidden] { display: none; }

<script type="module">/*__BUNDLE__*/</script>
<script type="module">
const O = window.Orbit
const S = window.SOURCES

// ---------- the steps ----------
// `lines` are [from, to] line numbers in the real file; the page cuts the excerpt from SOURCES.
const STEP1_RENDER = `on('ui.render', { component: 'Pane', requestId: PANE }, async ($, e) => {
  const { Text } = $.ui.resolve(e)
  return <Text>Hello, orbit</Text>
})`

const STEPS = [
  { short: 'Intro' },
  {
    short: 'A pane', title: 'A pane', mode: 'hello',
    adds: ['Three files make a mod. Claude Code calls the register function in it.', 'A command and a prompt open a pane. A render hook draws in that pane.'],
    blocks: [
      { file: 'plugin.json', path: '.claude-plugin/plugin.json', anchors: [['"name"', 1], ['"license"', 2]], pair: true },
      { file: 'hooks.json', path: 'hooks/hooks.json', anchors: [['"modules"', 1]], pair: true },
      { file: 'register.tsx', path: 'hooks/register.tsx', anchors: [['export const register: Register', 2], ['$.command.register', 1], ["on('prompt.submit'", 2], ['return next(e)', 1]],
        hl: { '$.command.register': 'Registers /orbit. Never give a command the name of a built-in.', "$.ui.open({ id: PANE, title: 'Agent orbit' }).catch": 'Opens the pane from a prompt. Then it opens at any terminal width.' } },
      { text: STEP1_RENDER, path: 'hooks/register.tsx', tag: 'step 1 version', hlRel: { 1: 'Draws the pane with the id agent-orbit: the words "Hello, orbit".' } },
    ],
    see: 'You give Claude a task. The pane opens on the right and says "Hello, orbit".',
  },
  {
    short: 'Track the agents', title: 'Track the agents', mode: 'rows',
    adds: ['A plain model in the module holds the main session and one entry per agent.', 'Four hooks fill it: agent.spawn, tool.call, turn.complete and prompt.context.'],
    blocks: [
      { file: 'live.ts', path: 'hooks/live.ts', anchors: [['export type Live = {', 3]] },
      { file: 'register.tsx', path: 'hooks/register.tsx', anchors: [['const READS', 1], ["on('prompt.context'", 1], ["on('agent.spawn'", 2], ['agent.model = shortModel', 1], ["on('tool.call'", 2], ['const step: Step', 1], ["on('turn.complete'", 1], ['if (e.agentId) {', 1]],
        hl: { 'await next(e)': 'Call next(e) first. Its result holds the new agentId and the model.', 'loopOf(e.agentId)': 'e.agentId names the agent that made the call. No id means Main.', 'READS.has(e.tool)': 'Read, Grep, Glob and Skill are reads: context. Every other tool is an action.' } },
    ],
    see: 'Text rows fill while the run goes: who runs, how much it read, what it did last.',
  },
  {
    short: 'Make it move', title: 'Make it move', mode: 'bare',
    adds: ['One Raster replaces the text: a grid of coloured terminal cells.', 'A clock paints a new frame about 16 times a second with $.ui.blit.'],
    blocks: [
      { file: 'register.tsx', path: 'hooks/register.tsx', anchors: [['$.clock.every(60', 6], ['const { Raster }', 5]],
        hl: { '$.clock.every(60': 'Paints a new frame every 60 ms: about 16 frames a second.', '$.ui.blit(': 'blit sends the cells. It must use the size of the mounted Raster.', 'e.props.scroll.bodyRows': 'Sizes the Raster from the pane, so it fits a short, narrow dock.' } },
      { file: 'frame.ts', path: 'hooks/frame.ts', anchors: [['export function drawFrame', 1], ['const where = ', 4], ['toBase64()', 1]] },
    ],
    see: 'Main pulses in the centre. Each agent orbits it, with a trail and a beam while it runs.',
  },
  {
    short: 'Make it explain', title: 'Make it explain', mode: 'raster',
    adds: ['Each hook writes one plain sentence with say and verbOf.', 'The frame adds a legend, a typed caption, a ticker and ◇ file chips.'],
    blocks: [
      { file: 'live.ts', path: 'hooks/live.ts', anchors: [['export function say', 3], ['export function verbOf', 5]] },
      { file: 'register.tsx', path: 'hooks/register.tsx', anchors: [['const file = baseName(what)', 2], ['${agent.name} ${step.what}', 1]],
        hl: { 'agent.context = [': 'Keeps the last 4 files that the agent read: its context.', '${agent.name} ${step.what}': 'Each tool call becomes one plain sentence for the caption.' } },
      { file: 'frame.ts', path: 'hooks/frame.ts', anchors: [['const newest = live.events', 4]], hl: { 'const shown': 'Types the caption out: one more letter every 12 ms.' } },
    ],
    see: 'The caption tells each event in plain words. The ◇ chips show what each agent read.',
  },
  {
    short: 'Talk back', title: 'Talk back', mode: 'raster', talkBack: true,
    adds: ['When the last agent of a wave ends, the mod sends a prompt to the chat.', 'A set of reported agents makes sure that it fires once per wave.'],
    blocks: [
      { file: 'register.tsx', path: 'hooks/register.tsx', anchors: [['// The mod talks back', 19]],
        hl: { 'wave.every(a => a.endedAt': 'Fires only when every agent of this wave has ended.', 'reported.add(a.id)': 'Remembers the reported agents, so the next wave starts clean.', '.submit({': '$.prompt.submit puts the prompt in the chat: the mod talks back.' } },
    ],
    see: 'The plugin message lands in the chat. Claude answers it with a short debrief.',
  },
  {
    short: 'The desktop view', title: 'The desktop view', mode: 'svg', talkBack: true,
    adds: ['The desktop app has no Raster. The same model draws as one SVG.', 'SMIL animates it. A negative begin keeps the motion smooth on each redraw.'],
    blocks: [
      { file: 'desktop.ts', path: 'hooks/desktop.ts', anchors: [['function phase(now', 3], ['for (let k = 0; k < 3', 3]],
        hl: { 'return `-${': 'Starts each animation at its phase now, so a redraw does not jump.' } },
      { file: 'register.tsx', path: 'hooks/register.tsx', anchors: [['if (vectorShown && busy', 4], ["if (e.surface === 'desktop')", 6]],
        hl: { 'now - lastRedraw > 2000': 'Draws the SVG again every 2 s while agents run.', 'isInteractive={true}': 'isInteractive turns on SMIL animation and hover tooltips.' } },
    ],
    see: 'The orbit in the desktop app: glowing nodes, flowing beams. Hover an agent for its task.',
  },
]

// ---------- syntax colours ----------
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
const KW = 'import|from|export|const|let|function|return|if|else|for|of|await|async|new|type|void|true|false|undefined|continue|break|as|in|switch|case|default|null'
const TOKEN = new RegExp([
  '(\\/\\/.*$)',
  '(`(?:\\\\.|[^`\\\\])*`?|\'(?:\\\\.|[^\'\\\\])*\'|"(?:\\\\.|[^"\\\\])*")',
  `(\\b(?:${KW})\\b)`,
  '(\\b0x[0-9a-fA-F]+\\b|\\b\\d[\\d_.]*\\b)',
  '(<\\/?[A-Z][A-Za-z]*)',
  '(\\$(?:\\.[A-Za-z]+)+)',
  '([A-Za-z_][\\w]*)(?=\\s*\\()',
].join('|'), 'g')
function colour(line, json) {
  let out = '', last = 0, m
  TOKEN.lastIndex = 0
  while ((m = TOKEN.exec(line))) {
    out += esc(line.slice(last, m.index))
    const [t, com, str, kw, num, tag, dol, fn] = m
    let cls = com ? 't-com' : str ? (json && /^\s*:/.test(line.slice(m.index + t.length)) ? 't-key' : 't-str') : kw ? 't-kw' : num ? 't-num' : tag ? 't-tag' : dol ? 't-dol' : 't-fn'
    out += `<span class="${cls}">${esc(t)}</span>`
    last = m.index + t.length
    if (t.length === 0) TOKEN.lastIndex++
  }
  return out + esc(line.slice(last))
}

const missing = (window.__missingAnchors = [])
function codeHtml(step) {
  let mark = 0
  const notes = []
  const blocks = step.blocks.map(b => {
    const isJson = (b.file || '').endsWith('.json')
    let rows = []
    if (b.text) {
      b.text.split('\n').forEach((src, i) => {
        const note = b.hlRel && b.hlRel[i + 1]
        if (note) notes.push(note)
        rows.push(`<div class="ln${note ? ' hl' : ''}"><span class="no">·</span><span class="mk">${note ? ++mark : ''}</span><span class="src">${colour(src, false) || ' '}</span></div>`)
      })
    } else {
      const all = S[b.file].split('\n')
      // Each range is [a unique piece of the first line, how many lines]; the search
      // goes on after the range before it, so an edit to the mod keeps the excerpt right.
      let from0 = 0
      const ranges = []
      for (const [anchor, count] of b.anchors || []) {
        const at = all.findIndex((l, i) => i >= from0 && l.includes(anchor))
        if (at < 0) { missing.push(`${b.file}: ${anchor}`); continue }
        ranges.push([at + 1, at + count])
        from0 = at + count
      }
      b.lines = ranges
      const used = new Set()
      // Dedent the excerpt by its smallest indent, so the code gets the width.
      const picked = b.lines.flatMap(([f, t]) => all.slice(f - 1, t)).filter(l => l.trim())
      const cut = Math.min(...picked.map(l => l.match(/^ */)[0].length))
      b.lines.forEach(([from, to], k) => {
        if (k > 0) rows.push(`<div class="gap">⋯</div>`)
        for (let n = from; n <= to; n++) {
          const hit = b.hl && Object.entries(b.hl).find(([k]) => !used.has(k) && (all[n - 1] ?? '').includes(k))
          if (hit) used.add(hit[0])
          const note = hit?.[1]
          if (note) notes.push(note)
          rows.push(`<div class="ln${note ? ' hl' : ''}"><span class="no">${n}</span><span class="mk">${note ? ++mark : ''}</span><span class="src">${colour((all[n - 1] ?? '').slice(cut), isJson) || ' '}</span></div>`)
        }
      })
    }
    const kind = isJson ? 'json' : 'ts'
    return `<div class="block"><div class="tab ${kind}">${b.path}${b.tag ? `<em>${b.tag}</em>` : ''}</div><pre>${rows.join('')}</pre></div>`
  })
  // Blocks marked `pair` sit side by side.
  const parts = []
  step.blocks.forEach((b, k) => {
    if (b.pair && step.blocks[k - 1]?.pair) parts[parts.length - 1].push(blocks[k])
    else parts.push([blocks[k]])
  })
  const html = parts.map(p => p.length > 1 ? `<div class="pair">${p.join('')}</div>` : p[0]).join('')
  return { html, notes }
}

// ---------- the panel ----------
const panel = document.getElementById('panel')
function renderPanel(i) {
  if (i === 0) { panel.innerHTML = ''; return }
  const step = STEPS[i]
  const { html, notes } = codeHtml(step)
  panel.innerHTML = `<div class="pin${panelMounted ? ' enter' : ''}">
    <div class="phead"><span class="num">${i}</span><div><div class="eyebrow">Step ${i} of 6</div><h2>${step.title}</h2></div></div>
    <p class="adds">${step.adds.map(esc).join('<br>')}</p>
    <div class="code" id="code">${html}</div>
    <ol class="notes">${notes.map((n, k) => `<li><b>${k + 1}</b><span>${esc(n)}</span></li>`).join('')}</ol>
    <div class="see"><span class="eyebrow">What you see</span><div>${esc(step.see)}</div></div>
  </div>`
  panelMounted = true
  fitCode()
}
let panelMounted = false
// Shrinks the code font until every excerpt fits: no scroll at 1440×900 or 1920×1080.
function fitCode() {
  const code = document.getElementById('code')
  if (!code) return
  // Only sizes from the type ladder: 16, 14, 12.
  for (const fs of innerHeight >= 1000 ? [16, 14, 12] : [14, 12]) {
    code.style.setProperty('--fs', fs + 'px')
    if (code.scrollHeight <= code.clientHeight + 1) break
  }
}

// ---------- the rail ----------
const rail = document.getElementById('rail')
STEPS.forEach((s, i) => {
  const b = document.createElement('button')
  b.innerHTML = i === 0 ? s.short : `<b>${i}</b>${s.short}`
  b.addEventListener('click', () => go(i))
  rail.appendChild(b)
})
function renderRail(i) {
  ;[...rail.querySelectorAll('button')].forEach((b, k) => {
    b.className = k === i ? 'on' : k < i ? 'past' : ''
    b.setAttribute('aria-current', k === i ? 'step' : 'false')
  })
  document.getElementById('fill').style.width = `${(i / 6) * (6 / 7) * 100 + 0.5}%`
}

// ---------- the stage ----------
const stage = document.getElementById('stage')
let step = 0
let run = null
let view = null // the elements the loop paints into

const chatHead = `<div class="head"><b>✻</b> Claude Code · ~/agent-orbit-class<br>--plugin-dir mods/agent-orbit</div>`

function windowHtml(kind, paneInner) {
  const desk = kind === 'desk'
  return `<div class="view enter"><div class="win ${desk ? 'desk' : 'term'}">
    <div class="bar"><span class="dots"><i></i><i></i><i></i></span><span class="grow">${desk ? 'Claude · agent-orbit-class' : 'agent-orbit-class — claude'}</span></div>
    <div class="body">
      <div class="chat">${chatHead}<div class="msgs" style="display:flex;flex-direction:column;gap:12px"></div><div class="prompt"><i></i></div></div>
      <div class="pane closed"><div class="pane-title"><b>Agent orbit</b><span class="meta"></span></div><div class="pane-body">${paneInner}</div></div>
    </div>
  </div></div>`
}

let mounted = false
function mount(i) {
  const s = STEPS[i]
  const first = !mounted
  mounted = true
  document.body.classList.toggle('intro', i === 0)
  if (i === 0) {
    stage.innerHTML = `<div class="view enter introv">
      <div class="svgwrap"></div>
      <div class="promise"><div class="eyebrow">A class for Tools4Ever</div>
        <h2>In 6 steps you build this: a live view of what Claude's agents do and read.</h2>
        <p>One mod for the Claude CLI and the desktop app. The page runs the real mod code on a simulated run.</p>
        <button class="btn primary" id="start">Start with step 1</button></div>
    </div>`
    document.getElementById('start').addEventListener('click', () => go(1))
  } else if (s.mode === 'svg') {
    stage.innerHTML = windowHtml('desk', '<div class="svgwrap"></div>')
  } else if (s.mode === 'hello') {
    stage.innerHTML = windowHtml('term', '<div class="hello">Hello, orbit</div>')
  } else if (s.mode === 'rows') {
    stage.innerHTML = windowHtml('term', '<div class="rows"></div>')
  } else {
    stage.innerHTML = windowHtml('term', '<canvas class="cells bloom"></canvas><canvas class="cells sharp"></canvas>')
  }
  if (first) stage.querySelector('.view')?.classList.remove('enter')
  const q = sel => stage.querySelector(sel)
  view = { msgs: q('.msgs'), pane: q('.pane'), meta: q('.pane-title .meta'), svg: q('.svgwrap'), rows: q('.rows'), sharp: q('canvas.sharp'), bloom: q('canvas.bloom'), body: q('.pane-body') }
  if (view.sharp) sizeCanvas()
}

// The grid: as many cells as fit the pane, clamped like register.tsx does (20-160 × 10-48).
let grid = null
function sizeCanvas() {
  const r = view.body.getBoundingClientRect()
  const lh = Math.max(13, Math.min(22, r.height / 35))
  const font = lh / 1.24
  const ctx = view.sharp.getContext('2d')
  ctx.font = `400 ${font}px 'Space Mono', monospace`
  const cw = ctx.measureText('M').width
  const columns = Math.max(20, Math.min(160, Math.floor(r.width / cw)))
  const rows = Math.max(10, Math.min(48, Math.floor(r.height / lh)))
  const dpr = devicePixelRatio || 1
  for (const c of [view.sharp, view.bloom]) {
    c.width = Math.round(columns * cw * dpr); c.height = Math.round(rows * lh * dpr)
    c.style.width = columns * cw + 'px'; c.style.height = rows * lh + 'px'
  }
  grid = { columns, rows, cw, lh, font, dpr }
}

// Step 3 has no explain layer yet: blank the legend row and the empty caption row.
function blankExplain(cells, columns, rows) {
  const blankRow = y => { for (let x = 0; x < columns; x++) cells[(y * columns + x) * 3] = 0x20 }
  blankRow(0)
  for (let y = 1; y < rows; y++) {
    let t = ''
    for (let x = 3; x < 10 && x < columns; x++) t += String.fromCodePoint(cells[(y * columns + x) * 3])
    if (t.startsWith('Waiting')) blankRow(y)
  }
}
const hex = c => '#' + (c & 0xffffff).toString(16).padStart(6, '0')
function paintCells(live) {
  const { columns, rows, cw, lh, font, dpr } = grid
  const cells = O.frameCells(live, columns, rows, Date.now())
  if (!liveOn && STEPS[step].mode === 'bare') blankExplain(cells, columns, rows)
  const ctx = view.sharp.getContext('2d')
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
  ctx.clearRect(0, 0, columns * cw, rows * lh)
  ctx.font = `400 ${font}px 'Space Mono', monospace`
  ctx.textBaseline = 'middle'
  ctx.textAlign = 'center'
  let last = -1
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < columns; x++) {
      const i = (y * columns + x) * 3
      const ch = cells[i]
      if (ch === 0x20) continue
      const fg = cells[i + 1] === 0x01000000 ? 0xeaf1f8 : cells[i + 1]
      if (fg !== last) { ctx.fillStyle = hex(fg); last = fg }
      ctx.fillText(String.fromCodePoint(ch), x * cw + cw / 2, y * lh + lh / 2 + 1)
    }
  }
  const b = view.bloom.getContext('2d')
  b.setTransform(1, 0, 0, 1, 0, 0)
  b.clearRect(0, 0, view.bloom.width, view.bloom.height)
  b.drawImage(view.sharp, 0, 0)
  view.meta.textContent = `${columns}×${rows} cells`
}

function paintSvg(model = run.live) {
  if (!view.svg) return
  view.svg.innerHTML = O.drawSvg(model, Date.now())
}

function paintRows() {
  const live = run.live
  const loops = [live.main, ...live.agents]
  const rowsHtml = loops.map(a => {
    const last = a.steps[a.steps.length - 1]
    const fresh = last && Date.now() - last.at < 400
    return `<div class="row${fresh ? ' flash' : ''}"><span class="${a.endedAt ? 'done' : 'runs'}">${a.endedAt ? 'done' : 'runs'}</span><span>${esc(a.name)}</span><span>${esc(a.model || '·')}</span><span>read <span class="n">${a.reads}</span></span><span>did <span class="a">${a.acts}</span></span><span class="last">${esc(last ? last.what : a.task || 'waits')}</span></div>`
  }).join('')
  view.rows.innerHTML = `<div class="note">// the live model, as text rows</div>${rowsHtml}`
  view.meta.textContent = `${live.agents.length} agents`
}

function paintChat() {
  const live = run.live
  view.msgs.innerHTML = run.chat.map(m => {
    if (m.kind === 'user') return `<div class="msg user">${esc(m.text)}</div>`
    if (m.kind === 'agent') {
      const a = live.agents.find(x => x.id === m.agentId)
      const done = a.endedAt !== undefined
      const s = Math.round(((a.endedAt ?? Date.now()) - a.startedAt) / 1000)
      return `<div class="msg agent"><span class="mark ${done ? 'done' : 'run'}">⏺</span> ${esc(a.type)}(${esc(a.task)})<div class="sub">⎿ ${done ? `Done · ${a.reads} reads · ${a.acts} actions · ${s}s` : `Running on ${esc(a.model)}…`}</div></div>`
    }
    if (m.kind === 'plugin') return `<div class="msg plugin"><span class="who">The agent-orbit plugin sent a message:</span>${esc(m.text)}</div>`
    return `<div class="msg claude"><span class="mark">⏺</span> ${esc(m.text)}</div>`
  }).join('')
  // Old messages keep their place without a new entrance.
  ;[...view.msgs.children].forEach((el, k) => { if (k < seen) el.style.animation = 'none' })
  seen = view.msgs.children.length
}
let seen = 0

// ---------- the run ----------
let lastFrame = 0, lastSvg = 0
function startRun() {
  const s = STEPS[step]
  run = new O.Run(step === 0 || !!s.talkBack)
  seen = 0
  lastSvg = 0
  if (view.msgs) view.msgs.innerHTML = ''
  if (view.pane) view.pane.classList.add('closed')
  if (view.svg) paintSvg()
}

function loop() {
  requestAnimationFrame(loop)
  if (liveOn && liveModel) { liveTick(Date.now()); return }
  if (!run) return
  const now = Date.now()
  if (run.elapsed(now) > O.LENGTH) startRun()
  const changed = run.tick(now)
  const mode = step === 0 ? 'svg' : STEPS[step].mode
  if (changed) {
    if (view.msgs) paintChat()
    // prompt.submit opens the pane.
    if (view.pane && run.live.events.length > 0) view.pane.classList.remove('closed')
  }
  if (mode === 'svg') {
    // Like the mod: draw on each change, and every 2 s while agents run.
    if (changed || (run.busy() && now - lastSvg > 2000) || lastSvg === 0) { paintSvg(); lastSvg = now }
  } else if (mode === 'rows') {
    if (changed || now - lastFrame > 400) { paintRows(); lastFrame = now }
  } else if (mode === 'bare' || mode === 'raster') {
    // Like $.clock.every(60, …): one frame each 60 ms.
    if (now - lastFrame >= 60) { paintCells(mode === 'bare' ? O.bare(run.live) : run.live); lastFrame = now }
  }
  const t = Math.min(O.LENGTH, run.elapsed(now))
  document.getElementById('clock').innerHTML = `simulated run <i>${t.toFixed(1)}s</i> / ${O.LENGTH}s`
}

function go(i) {
  leaveLive()
  i = Math.max(0, Math.min(6, i))
  step = i
  renderRail(i)
  mount(i)
  renderPanel(i)
  startRun()
  try { history.replaceState(null, '', '#' + i) } catch {}
}

addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return
  if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return
  if (e.key === 'l' || e.key === 'L') { if (liveModel) enterLive(); return }
  if (liveOn) {
    if (e.key === 't' || e.key === 'T') { liveView = liveView === 'svg' ? 'term' : 'svg'; mountLive(); return }
    if (e.key === 's' || e.key === 'S') { go(step); return }
    if (e.key === 'Tab' && sessions.size > 1) {
      e.preventDefault()
      const ids = [...sessions.keys()]
      select(ids[(ids.indexOf(selectedId) + (e.shiftKey ? ids.length - 1 : 1)) % ids.length], true)
      return
    }
    if (e.key === 'r' || e.key === 'R') return
  }
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); go(step + 1) }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(step - 1) }
  else if (/^[0-6]$/.test(e.key)) go(+e.key)
  else if (e.key === 'r' || e.key === 'R') startRun()
  else if (e.key === 'f' || e.key === 'F') {
    if (document.fullscreenElement) document.exitFullscreen?.()
    else document.documentElement.requestFullscreen?.().catch(() => {})
  }
})
let resizeT
addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (view && view.sharp) sizeCanvas(); fitCode() }, 120) })
document.fonts?.ready.then(() => { if (view && view.sharp) sizeCanvas(); fitCode() })

// ---------- live mode: the same model, from a real Claude Code session ----------
// The bridge streams the mod's Live model over SSE (GET /events). The page then draws it
// with the same drawSvg / drawFrame, and animates between messages with Date.now().
let liveModel = null, liveOn = false, liveView = 'svg', lastMsg = 0, liveChanged = false, everLive = false
// Two chats at once: the latest model per session.id, and which one the view draws.
const sessions = new Map() // id -> { id, label, surface, model, lastMsg }
let selectedId = null, pinned = false
const chipsEl = document.getElementById('chips')
const ICON = {
  terminal: '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x=".75" y="1.75" width="12.5" height="10.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M3.5 5.2 5.6 7 3.5 8.8M7 9h3.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  desktop: '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x=".75" y="1.5" width="12.5" height="8.5" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M5 12.6h4M7 10v2.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>',
}
const newestAt = s => { const ev = s.model.events; return ev.length ? ev[ev.length - 1].at : 0 }
function selected() { return sessions.get(selectedId) }
function select(id, byPerson) {
  if (!sessions.has(id)) return
  if (byPerson) pinned = true
  if (id !== selectedId) {
    selectedId = id
    liveModel = sessions.get(id).model
    lastMsg = sessions.get(id).lastMsg
    liveChanged = true
    lastSvg = 0
  }
  renderChips()
  renderLiveChat()
}
function renderChips() {
  const now = Date.now()
  const list = [...sessions.values()]
  const key = list.map(s => s.id).join('|')
  if (chipsEl.dataset.key !== key) {
    chipsEl.dataset.key = key
    chipsEl.innerHTML = list.map(s => `<button class="sess" role="tab" data-id="${esc(s.id)}"></button>`).join('')
    liveKeys()
    chipsEl.querySelectorAll('.sess').forEach(b => b.addEventListener('click', () => { select(b.dataset.id, true); if (!liveOn) enterLive() }))
  }
  chipsEl.querySelectorAll('.sess').forEach(b => {
    const s = sessions.get(b.dataset.id)
    if (!s) return
    const running = s.model.agents.filter(a => a.endedAt === undefined).length
    const html = `${ICON[s.surface] || ICON.terminal}<span>${esc(s.label)}</span><span class="n${running ? '' : ' zero'}">${running}</span>`
    if (b.innerHTML !== html) b.innerHTML = html
    b.classList.toggle('on', s.id === selectedId)
    b.classList.toggle('stale', now - s.lastMsg > 30000)
    b.setAttribute('aria-selected', String(s.id === selectedId))
    b.title = `${s.label} (${s.surface}) · ${running} running${now - s.lastMsg > 30000 ? ' · no message for 30 s' : ''}`
  })
}
setInterval(() => { if (sessions.size) renderChips() }, 1000)
const badge = document.getElementById('badge')
const hint = document.getElementById('hint')
const keysEl = document.getElementById('keys')
const tutorialKeys = keysEl.innerHTML
badge.addEventListener('click', () => { if (liveModel) enterLive() })

function setBadge(state) {
  badge.classList.add('show')
  badge.classList.toggle('idle', state !== 'live')
  badge.querySelector('span').textContent = state === 'live'
    ? (liveOn ? 'LIVE · connected to Claude Code' : 'LIVE session · press L')
    : 'reconnecting to Claude Code…'
}

function connect() {
  if (!/^https?:$/.test(location.protocol) || typeof EventSource === 'undefined') { hint.hidden = false; return }
  let es
  const open = () => {
    es = new EventSource('/events')
    es.onmessage = ev => {
      let data
      try { data = JSON.parse(ev.data) } catch { return }
      if (!data || !data.main || !Array.isArray(data.agents)) return
      delete data.sentAt
      const info = data.session && data.session.id ? data.session : { id: 'default', label: 'Claude Code', surface: 'terminal' }
      delete data.session
      // JSON has no undefined: a null endedAt still means "runs".
      for (const a of [data.main, ...data.agents]) if (a.endedAt == null) delete a.endedAt
      for (const k of ['particles', 'events', 'files', 'skills']) if (!Array.isArray(data[k])) data[k] = []
      const first = !liveModel
      const now = Date.now()
      sessions.set(info.id, { id: info.id, label: info.label || info.id, surface: info.surface || 'terminal', model: data, lastMsg: now })
      // Until the person clicks a chip, follow the session with the newest event.
      let want = selectedId && sessions.has(selectedId) ? selectedId : info.id
      if (!pinned) for (const s of sessions.values()) if (newestAt(s) > newestAt(sessions.get(want))) want = s.id
      if (want !== selectedId) select(want, false)
      else renderChips()
      if (info.id === selectedId) {
        liveModel = data
        lastMsg = now
        liveChanged = true
      }
      renderLiveChat()
      everLive = true
      hint.hidden = true
      if (first) enterLive()
      else setBadge('live')
    }
    es.onerror = () => {
      if (!everLive) { es.close(); hint.hidden = false; return } // no bridge: stay in tutorial mode
      setBadge('down')
      // EventSource retries by itself; when it gives up, try again quietly.
      if (es.readyState === EventSource.CLOSED) setTimeout(open, 3000)
    }
  }
  open()
  setTimeout(() => { if (!liveModel) hint.hidden = false }, 2000)
}

function enterLive() {
  liveOn = true
  setBadge('live')
  mountLive()
}

function leaveLive() {
  if (!liveOn) return
  liveOn = false
  document.body.classList.remove('live')
  keysEl.innerHTML = tutorialKeys
  if (liveModel) setBadge('live')
}

function mountLive() {
  document.body.classList.add('intro', 'live')
  ;[...rail.querySelectorAll('button')].forEach(b => { b.className = ''; b.setAttribute('aria-current', 'false') })
  panel.innerHTML = ''
  const wait = `<div class="wait" hidden>waiting for the session…</div>`
  const orbit = liveView === 'svg'
    ? `<div class="svgwrap"></div>`
    : `<div class="win term">
        <div class="bar"><span class="dots"><i></i><i></i><i></i></span><span class="grow">Agent orbit · the terminal view of the live session</span></div>
        <div class="pane"><div class="pane-title"><b>Agent orbit</b><span class="meta"></span></div><div class="pane-body"><canvas class="cells bloom"></canvas><canvas class="cells sharp"></canvas></div></div>
      </div>`
  stage.innerHTML = `<div class="view enter livev">
    <div class="lorbit">${orbit}${wait}</div>
    <aside class="lchat" aria-label="The chat of the selected session">
      <div class="lhead"><span class="licon"></span><span class="ltitle">Chat</span></div>
      <div class="lmsgs" id="lmsgs" aria-live="polite"></div>
      <form class="ctl" id="ctl" autocomplete="off">
        <div class="ctl-row">
          <button type="button" class="btn sm primary" data-text="${esc(O.PROMPT)}">Run the demo</button>
          <button type="button" class="btn sm" data-text="Give a debrief of the agents that just ran, in at most 4 lines.">Ask for a debrief</button>
        </div>
        <div class="ctl-row">
          <input name="free" placeholder="Type a prompt for Claude Code" aria-label="A prompt for Claude Code">
          <button type="submit" class="btn sm">Send</button>
        </div>
      </form>
    </aside>
  </div>`
  chatKeys = []
  const ctl = document.getElementById('ctl')
  ctl.querySelectorAll('button[data-text]').forEach(b => b.addEventListener('click', () => sendPrompt(b.dataset.text, b)))
  ctl.addEventListener('submit', ev => {
    ev.preventDefault()
    const input = ctl.elements.free
    const text = input.value.trim()
    if (!text) { input.focus(); return }
    sendPrompt(text, ctl.querySelector('button[type=submit]')).then(ok => { if (ok) input.value = '' })
  })
  const q = sel => stage.querySelector(sel)
  view = { svg: q('.svgwrap'), sharp: q('canvas.sharp'), bloom: q('canvas.bloom'), body: q('.pane-body'), meta: q('.pane-title .meta') }
  if (view.sharp) sizeCanvas()
  lastSvg = 0
  lastFrame = 0
  liveKeys()
  renderLiveChat()
}

// ---------- the live chat: the same chat as in the session, 1:1 ----------
const pending = [] // { sid, text, at, failed }
const sentByPage = new Set()
let chatKeys = []
const norm = t => String(t || '').trim().replace(/\s+/g, ' ')
function renderLiveChat() {
  const box = document.getElementById('lmsgs')
  if (!box) return
  const s = selected()
  const head = stage.querySelector('.lhead')
  if (head) {
    head.querySelector('.licon').innerHTML = s ? (ICON[s.surface] || ICON.terminal) : ICON.terminal
    head.querySelector('.ltitle').textContent = `Chat · ${s ? s.label : 'Claude Code'}`
  }
  const chat = (s && Array.isArray(s.model.chat)) ? s.model.chat : []
  // A pending bubble leaves once its text shows up in the session's chat.
  for (let i = pending.length - 1; i >= 0; i--) {
    const p = pending[i]
    const owner = sessions.get(p.sid)
    const seen = owner && Array.isArray(owner.model.chat) && owner.model.chat.some(m => m.role !== 'claude' && norm(m.text) === norm(p.text) && m.at >= p.at - 10000)
    if (seen || (p.failed && Date.now() - p.at > 6000)) pending.splice(i, 1)
  }
  const items = chat.map(m => ({ key: `${m.role}|${m.at}|${m.text.length}`, role: m.role, text: m.text }))
  for (const p of pending) if (s && p.sid === s.id) items.push({ key: `pending|${p.at}|${p.failed ? 'x' : ''}`, role: 'pending', text: p.text, failed: p.failed })
  const keys = items.map(i => i.key)
  const html = it => {
    if (it.role === 'claude') return `<div class="bub claude"><span class="who">Claude</span>${esc(it.text)}</div>`
    if (it.role === 'you') return `<div class="bub you">${esc(it.text)}</div>`
    if (it.role === 'plugin') return `<div class="bub plugin"><span class="tag">${sentByPage.has(norm(it.text)) ? 'from the orbit page' : 'from agent-orbit'}</span>${esc(it.text)}</div>`
    return `<div class="bub plugin pending"><span class="tag">${it.failed ? 'not sent' : 'sending…'}</span>${esc(it.text)}</div>`
  }
  const isPrefix = chatKeys.length <= keys.length && chatKeys.every((k, i) => k === keys[i])
  if (isPrefix) {
    if (keys.length === chatKeys.length) return
    box.insertAdjacentHTML('beforeend', items.slice(chatKeys.length).map(it => html(it).replace('class="bub', 'class="bub enter')).join(''))
  } else {
    box.innerHTML = items.length ? items.map(html).join('') : '<div class="lempty">No messages yet. Type a prompt in the session, or send one from here.</div>'
  }
  chatKeys = keys
  box.scrollTop = box.scrollHeight
}
function liveKeys() {
  if (!liveOn) return
  keysEl.innerHTML = `${sessions.size > 1 ? '<kbd>Tab</kbd> for the next chat · ' : ''}<kbd>T</kbd> ${liveView === 'svg' ? 'for the terminal view' : 'for the desktop view'} · <kbd>S</kbd> for the steps · <kbd>F</kbd> for full screen`
}

// Two-way: the bridge queues the prompt, and the mod submits it into the chat.
let toastT
function toast(text, isError) {
  const t = document.getElementById('toast')
  t.textContent = text
  t.classList.toggle('err', !!isError)
  t.classList.add('show')
  clearTimeout(toastT)
  toastT = setTimeout(() => t.classList.remove('show'), 2600)
}
async function sendPrompt(text, button) {
  if (button) button.disabled = true
  try {
    const s = selected()
    sentByPage.add(norm(text))
    var mine = { sid: s ? s.id : 'default', text, at: Date.now(), failed: false }
    pending.push(mine)
    renderLiveChat()
    const res = await fetch('/prompt', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text, session: s ? s.id : undefined }) })
    if (!res.ok) throw new Error(String(res.status))
    toast(s ? `Sent to Claude Code · ${s.label}` : 'Sent to Claude Code')
    return true
  } catch {
    if (typeof mine !== 'undefined') { mine.failed = true; renderLiveChat() }
    toast('Not sent: the bridge does not answer. Run bun bridge/serve.ts.', true)
    return false
  } finally {
    if (button) button.disabled = false
  }
}

function liveTick(now) {
  const m = liveModel
  const busy = m.agents.some(a => a.endedAt === undefined)
  const wait = stage.querySelector('.wait')
  if (wait) wait.hidden = m.agents.length > 0
  if (liveView === 'svg') {
    // Like the mod: draw on each change, and every 2 s while agents run.
    if (liveChanged || lastSvg === 0 || (busy && now - lastSvg > 2000)) { paintSvg(m); lastSvg = now }
  } else if (now - lastFrame >= 60) {
    paintCells(m)
    lastFrame = now
  }
  liveChanged = false
  document.getElementById('clock').innerHTML = `live session · last update <i>${Math.max(0, Math.round((now - lastMsg) / 1000))}s</i> ago`
}

go(+(location.hash.slice(1)) || 0)
loop()
connect()
</script>
