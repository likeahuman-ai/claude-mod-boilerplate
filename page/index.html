<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent orbit tutorial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #060a14;
  --navy: #0b1222;
  --deep: #0e1629;
  --raise: #121c33;
  --line: #1c2946;
  --line-2: #2a3b5f;
  --text: #e8edf7;
  --muted: #8b98b3;
  --faint: #56627e;
  --lime: #c6ff3d;
  --cyan: #5ee0ff;
  --amber: #ffc857;
  --green: #6dffa8;
  --pink: #ff7ad9;
  --display: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --ease: cubic-bezier(.2, .8, .2, 1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--ink);
  color: var(--text);
  font-family: var(--display);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(1100px 700px at 28% 55%, rgba(38, 64, 120, .28), transparent 70%),
    radial-gradient(700px 500px at 90% 10%, rgba(198, 255, 61, .05), transparent 70%);
  pointer-events: none;
}
.app {
  position: relative;
  height: 100vh;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: 18px 28px 12px;
  gap: 14px;
}

/* ---------- top: title and the rail ---------- */
header { display: flex; align-items: center; gap: 36px; }
.brand { display: flex; align-items: center; gap: 12px; white-space: nowrap; }
.brand svg { flex: none; }
.brand h1 { font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
.brand h1 span { color: var(--muted); font-weight: 400; }
.rail { flex: 1; display: grid; grid-template-columns: repeat(7, 1fr); position: relative; }
.rail::before {
  content: ''; position: absolute; left: 0; right: 0; top: 7px; height: 1px; background: var(--line-2);
}
.rail .fill {
  position: absolute; left: 0; top: 7px; height: 1px; background: var(--lime);
  box-shadow: 0 0 8px var(--lime); transition: width .6s var(--ease);
}
.rail button {
  position: relative; background: none; border: 0; color: var(--faint); cursor: pointer;
  font: 500 12.5px/1.2 var(--display); text-align: left; padding: 22px 8px 0 0;
  transition: color .3s;
}
.rail button::before {
  content: ''; position: absolute; left: 0; top: 2px; width: 11px; height: 11px; border-radius: 50%;
  background: var(--ink); border: 1.5px solid var(--line-2); transition: all .35s var(--ease);
}
.rail button b { font-family: var(--mono); font-weight: 500; margin-right: 6px; color: inherit; }
.rail button:hover { color: var(--text); }
.rail button.past { color: var(--muted); }
.rail button.past::before { border-color: var(--lime); background: var(--lime); }
.rail button.on { color: var(--text); }
.rail button.on::before { border-color: var(--lime); background: var(--ink); box-shadow: 0 0 0 4px rgba(198,255,61,.16), 0 0 14px var(--lime); }
.rail button:focus-visible { outline: 2px solid var(--lime); outline-offset: 4px; border-radius: 4px; }

/* ---------- the two halves ---------- */
main { min-height: 0; display: grid; grid-template-columns: 57fr 43fr; gap: 26px; }
.stage { position: relative; min-height: 0; }
.panel { position: relative; min-height: 0; display: flex; flex-direction: column; }
footer { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; color: var(--faint); }
footer kbd { font-family: var(--mono); font-size: 11.5px; color: var(--muted); border: 1px solid var(--line-2); border-radius: 5px; padding: 1px 6px; }
.clock { font-family: var(--mono); font-size: 12px; color: var(--faint); }
.clock i { font-style: normal; color: var(--lime); }

/* intro: the orbit takes the whole width */
body.intro main { grid-template-columns: 1fr 0fr; gap: 0; }
body.intro .panel { opacity: 0; pointer-events: none; }

/* ---------- windows ---------- */
.view { position: absolute; inset: 0; display: flex; flex-direction: column; }
.view.enter { animation: viewIn .7s var(--ease) both; }
@keyframes viewIn { from { opacity: 0; transform: translateY(10px) scale(.99); } to { opacity: 1; transform: none; } }
.win {
  flex: 1; min-height: 0; display: flex; flex-direction: column;
  background: #070b16; border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  box-shadow: 0 40px 80px -30px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.02) inset, 0 0 120px -60px rgba(94,224,255,.25);
}
.bar {
  flex: none; height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 14px;
  background: linear-gradient(#111a2e, #0d1426); border-bottom: 1px solid var(--line);
  font: 500 12px var(--mono); color: var(--muted);
}
.bar .dots { display: flex; gap: 7px; margin-right: 10px; }
.bar .dots i { width: 11px; height: 11px; border-radius: 50%; background: #2a3550; }
.bar .dots i:nth-child(1) { background: #ff5f57; } .bar .dots i:nth-child(2) { background: #febc2e; } .bar .dots i:nth-child(3) { background: #28c840; }
.bar .grow { flex: 1; text-align: center; margin-right: 70px; }
.body { flex: 1; min-height: 0; display: grid; grid-template-columns: 33fr 67fr; }

/* the chat column, CLI style */
.chat {
  min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end;
  padding: 14px 16px 10px; gap: 12px; border-right: 1px solid var(--line);
  font: 400 12.5px/1.5 var(--mono); color: #c6cfdf;
}
.chat .head { margin-bottom: auto; color: var(--muted); font-size: 11.5px; border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 10px; }
.chat .head b { color: #d97757; font-weight: 500; }
.msg { animation: msgIn .5s var(--ease) both; }
@keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.msg.user { color: var(--text); background: #111a2e; border-radius: 6px; padding: 6px 8px; }
.msg.user::before { content: '> '; color: var(--muted); }
.msg .mark { color: var(--text); }
.msg.agent .mark.run { color: var(--amber); animation: blink 1s steps(2) infinite; }
.msg.agent .mark.done { color: var(--green); }
.msg.agent .sub { color: var(--faint); padding-left: 2ch; }
.msg.plugin { border: 1px solid rgba(198,255,61,.45); border-radius: 8px; padding: 8px 10px; background: rgba(198,255,61,.05); box-shadow: 0 0 30px -10px rgba(198,255,61,.35); white-space: pre-wrap; font-size: 11.5px; }
.msg.plugin .who { color: var(--lime); display: block; margin-bottom: 4px; font-weight: 500; }
.msg.claude { white-space: pre-wrap; }
.msg.claude .mark { color: var(--text); }
.prompt { flex: none; border-top: 1px solid var(--line-2); border-bottom: 1px solid var(--line-2); padding: 6px 2px; color: var(--faint); }
.prompt::before { content: '> '; }
.prompt i { display: inline-block; width: .6em; height: 1.1em; vertical-align: -2px; background: var(--muted); animation: blink 1.1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* the docked pane */
.pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; padding: 10px 12px 12px; }
.pane-title { flex: none; display: flex; justify-content: space-between; font: 500 11.5px var(--mono); color: var(--muted); padding: 0 2px 6px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
.pane-title b { color: var(--lime); font-weight: 500; }
.pane-body { flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; }
.pane.closed { opacity: 0; transform: translateX(24px); }
.pane { transition: opacity .6s var(--ease), transform .6s var(--ease); }
.hello { font: 500 26px var(--mono); color: var(--text); }
.hello::after { content: ''; display: inline-block; width: .55em; height: 1em; margin-left: 6px; vertical-align: -3px; background: var(--lime); animation: blink 1.1s steps(2) infinite; }
.cells { position: absolute; }
.cells.bloom { filter: blur(5px) saturate(1.4); opacity: .55; mix-blend-mode: screen; }

/* step 2: the text rows */
.rows { width: 100%; align-self: flex-start; font: 400 13.5px/1.55 var(--mono); }
.rows .note { color: var(--faint); margin-bottom: 12px; }
.rows .row { display: grid; grid-template-columns: 5ch 12ch 7ch 8ch 8ch; gap: 0 1ch; padding: 5px 8px; border-radius: 6px; transition: background .6s; }
.rows .row.flash { background: rgba(94,224,255,.12); transition: none; }
.rows .row .last { grid-column: 2 / -1; color: var(--muted); font-size: 12.5px; }
.rows .runs { color: var(--amber); } .rows .done { color: var(--green); }
.rows .n { color: var(--cyan); } .rows .a { color: var(--amber); }
.rows .ev { margin-top: 14px; padding-top: 10px; border-top: 1px dashed var(--line-2); color: var(--faint); font-size: 12px; }

/* desktop app */
.desk .bar { background: linear-gradient(#141c2f, #10182a); }
.desk .body { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) minmax(0, 24%); }
.desk .pane { order: 1; }
.desk .chat { order: 2; border-right: 0; border-top: 1px solid var(--line); flex-direction: row; align-items: flex-end; gap: 16px; padding: 10px 16px 12px; }
.desk .chat .head { display: none; }
.desk .chat .msgs { flex: 1; min-width: 0; max-height: 100%; overflow: hidden; justify-content: flex-end; }
.desk .prompt { flex: none; width: 26%; }
.desk .chat { font-family: var(--display); font-size: 13px; line-height: 1.45; background: #0a1020; }
.desk .chat .head { font-family: var(--display); }
.desk .msg.user { background: #1a2440; border-radius: 12px 12px 4px 12px; padding: 8px 11px; margin-left: 14%; }
.desk .msg.user::before { content: none; }
.desk .msg.plugin { font-family: var(--mono); font-size: 11px; }
.desk .prompt { border: 1px solid var(--line-2); border-radius: 12px; padding: 9px 12px; font-family: var(--display); }
.desk .prompt::before { content: 'Reply to Claude…'; }
.desk .prompt i { display: none; }
.svgwrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.svgwrap svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 30px 60px rgba(0,0,0,.6)); }

/* intro */
.introv { position: absolute; inset: 0; }
.introv .svgwrap { inset: 0 0 0 33%; }
.introv .promise { position: absolute; left: 0; bottom: 8%; max-width: 31%; z-index: 2; }
.introv .kicker { font: 500 13px var(--mono); color: var(--lime); margin-bottom: 18px; display: flex; gap: 10px; align-items: center; }
.introv .kicker::before { content: ''; width: 28px; height: 1px; background: var(--lime); }
.introv h2 { font-size: clamp(30px, 3.5vw, 60px); line-height: 1.02; letter-spacing: -.03em; font-weight: 700; }
.introv p { margin-top: 20px; font-size: 18px; line-height: 1.5; color: var(--muted); max-width: 30ch; }
.introv .go { margin-top: 28px; display: inline-flex; gap: 10px; align-items: center; font: 500 14px var(--display); color: var(--ink); background: var(--lime); border: 0; border-radius: 999px; padding: 11px 20px; cursor: pointer; box-shadow: 0 0 40px -6px rgba(198,255,61,.6); }
.introv .go:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }

/* ---------- the panel ---------- */
.pin { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.pin.enter > * { animation: panelIn .6s var(--ease) both; }
.pin.enter > *:nth-child(2) { animation-delay: .05s; } .pin.enter > *:nth-child(3) { animation-delay: .1s; }
.pin.enter > *:nth-child(4) { animation-delay: .15s; } .pin.enter > *:nth-child(5) { animation-delay: .2s; }
@keyframes panelIn { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }
.phead { display: flex; align-items: flex-end; gap: 18px; }
.phead .num { font: 800 clamp(50px, 7.6vh, 96px)/.8 var(--display); color: var(--lime); letter-spacing: -.05em; text-shadow: 0 0 40px rgba(198,255,61,.35); }
.phead .of { font: 500 12.5px var(--mono); color: var(--faint); margin-bottom: 6px; }
.phead h2 { font-size: clamp(28px, 3.9vh, 40px); line-height: 1; font-weight: 700; letter-spacing: -.025em; }
.adds { margin-top: 12px; font-size: clamp(14px, 1.8vh, 17px); line-height: 1.45; color: #c3cde0; max-width: 56ch; }
.code {
  margin-top: 16px; flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 8px;
  --fs: 14px;
}
.block { flex: none; min-width: 0; background: #080d1a; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.tab { display: flex; align-items: center; gap: 8px; padding: 4px 12px; background: #0d1427; border-bottom: 1px solid var(--line); font: 500 11.5px var(--mono); color: var(--muted); }
.pair { flex: none; display: grid; grid-template-columns: 1.3fr 1fr; gap: 8px; align-items: start; }
.tab::before { content: ''; width: 7px; height: 7px; border-radius: 2px; background: var(--line-2); }
.tab.ts::before { background: #3e7bff; } .tab.json::before { background: var(--amber); }
.tab em { font-style: normal; color: var(--faint); margin-left: auto; }
pre { margin: 0; padding: 4px 0; font: 400 var(--fs)/1.5 var(--mono); font-variant-ligatures: none; color: #c9d3e6; tab-size: 2; }
pre .ln { display: grid; grid-template-columns: 3.6ch 1.6ch minmax(0, 1fr); padding-right: 10px; border-left: 2px solid transparent; }
pre .ln .no { text-align: right; color: #3a4766; padding-right: 1ch; user-select: none; }
pre .ln .mk { color: var(--lime); font-weight: 700; font-size: .85em; }
pre .ln .src { white-space: pre; overflow: hidden; text-overflow: ellipsis; }
pre .ln.hl .src { white-space: pre-wrap; overflow-wrap: anywhere; }
pre .ln.hl { background: linear-gradient(90deg, rgba(198,255,61,.13), rgba(198,255,61,.03)); border-left-color: var(--lime); }
pre .ln.hl .no { color: var(--lime); }
pre .gap { color: #34405c; padding-left: 4.5ch; font-size: .85em; line-height: 1.3; }
.t-com { color: #5d6a88; font-style: italic; } .t-str { color: #a5e88a; } .t-kw { color: #c792ea; }
.t-num { color: #ffb86b; } .t-fn { color: var(--cyan); } .t-dol { color: var(--lime); } .t-tag { color: #ff8fa3; } .t-key { color: #82aaff; }
.notes { margin-top: 10px; list-style: none; display: grid; gap: 6px; }
.notes li { display: grid; grid-template-columns: 22px 1fr; align-items: baseline; font-size: clamp(13.5px, 1.75vh, 16px); line-height: 1.4; color: #d3dbea; }
.notes li b { font: 700 12px var(--mono); color: var(--ink); background: var(--lime); border-radius: 50%; width: 18px; height: 18px; display: inline-grid; place-items: center; }
.see { margin-top: 12px; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line-2); background: linear-gradient(90deg, rgba(94,224,255,.07), transparent); display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: baseline; font-size: clamp(14px, 1.85vh, 17px); line-height: 1.4; }
.see span { font: 500 12px var(--mono); color: var(--cyan); white-space: nowrap; }

/* ---------- live mode ---------- */
.badge {
  display: none; align-items: center; gap: 9px; flex: none; border: 1px solid rgba(198,255,61,.5); background: rgba(198,255,61,.08);
  color: var(--lime); font: 600 12.5px var(--mono); padding: 6px 12px; border-radius: 999px; cursor: pointer;
}
.badge.show { display: inline-flex; }
.badge i { width: 8px; height: 8px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 0 0 rgba(198,255,61,.7); animation: pulse 1.6s infinite; }
.badge.idle { color: var(--muted); border-color: var(--line-2); background: none; }
.badge.idle i { background: var(--muted); animation: none; }
.badge:focus-visible { outline: 2px solid var(--lime); outline-offset: 3px; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(198,255,61,.7); } 70% { box-shadow: 0 0 0 10px rgba(198,255,61,0); } 100% { box-shadow: 0 0 0 0 rgba(198,255,61,0); } }
body.live .rail { opacity: 0; pointer-events: none; }
.livebox { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.liverow { display: flex; align-items: center; gap: 8px; }
.chips { display: none; gap: 6px; }
body.live .chips { display: flex; }
.sess {
  display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 11px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line-2); background: var(--raise); color: var(--text); font: 500 12.5px var(--display);
  transition: opacity .3s, background .3s, border-color .3s;
}
.sess svg { flex: none; color: var(--muted); }
.sess .n { font: 600 11.5px var(--mono); color: var(--amber); }
.sess .n.zero { color: var(--faint); }
.sess.on { background: var(--lime); border-color: var(--lime); color: var(--ink); }
.sess.on svg, .sess.on .n { color: var(--ink); }
.sess.stale { opacity: .45; }
.sess:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }
.same { display: none; font-size: 12px; color: var(--muted); }
body.live .same { display: block; }
.ctl {
  position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 3;
  display: flex; gap: 8px; align-items: center; padding: 8px; border-radius: 14px;
  background: rgba(10, 16, 32, .88); border: 1px solid var(--line-2); backdrop-filter: blur(10px);
  box-shadow: 0 20px 40px -20px rgba(0,0,0,.8); width: min(860px, calc(100% - 32px));
}
.ctl button, .ctl input { font: 500 13.5px var(--display); border-radius: 9px; height: 36px; }
.ctl button { flex: none; padding: 0 14px; cursor: pointer; border: 1px solid var(--line-2); background: var(--raise); color: var(--text); }
.ctl button:hover { border-color: var(--muted); }
.ctl button.primary { background: var(--lime); border-color: var(--lime); color: var(--ink); font-weight: 600; }
.ctl button:disabled { opacity: .5; cursor: default; }
.ctl input { flex: 1; min-width: 0; padding: 0 12px; background: #070b16; border: 1px solid var(--line-2); color: var(--text); }
.ctl input::placeholder { color: var(--faint); }
.ctl :focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }
.livev .win { height: calc(100% - 66px); }
.livev .svgwrap { inset: 0 0 66px 0; }
.toast {
  position: fixed; left: 50%; bottom: 124px; transform: translate(-50%, 12px); opacity: 0; z-index: 10;
  background: var(--lime); color: var(--ink); font: 600 14px var(--display); padding: 10px 18px; border-radius: 999px;
  box-shadow: 0 0 40px -6px rgba(198,255,61,.6); transition: opacity .3s, transform .3s var(--ease); pointer-events: none;
}
.toast.err { background: var(--amber); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.livev .win .pane { flex: 1; }
.wait { position: absolute; left: 50%; top: 14%; transform: translateX(-50%); font: 500 15px var(--mono); color: var(--muted); background: rgba(6,10,20,.75); border: 1px solid var(--line-2); border-radius: 999px; padding: 8px 16px; animation: blink 2.4s ease-in-out infinite; }
.wait[hidden] { display: none; }
.hint { font: 400 12px var(--mono); color: var(--faint); }
.hint b { color: var(--muted); font-weight: 500; }
@media (prefers-reduced-motion: reduce) {
  .view.enter, .pin.enter > *, .msg { animation: none; }
}
</style>
</head>
<body class="intro">
<div class="app">
  <header>
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><ellipse cx="13" cy="13" rx="11.5" ry="6.5" fill="none" stroke="#2a3b5f" stroke-dasharray="1.5 2.5"/><circle cx="13" cy="13" r="3.6" fill="#c6ff3d"/><circle cx="23.5" cy="10.5" r="2" fill="#5ee0ff"/></svg>
      <h1>Build a Claude Code mod: agent orbit</h1>
    </div>
    <nav class="rail" id="rail" aria-label="Steps"><div class="fill" id="fill"></div></nav>
    <div class="livebox">
      <div class="liverow"><div class="chips" id="chips" role="tablist" aria-label="Sessions"></div>
      <button class="badge" id="badge" title="Show the live orbit (L)"><i></i><span>LIVE · connected to Claude Code</span></button></div>
      <div class="same" id="same">This page and the pane in each chat draw the same model.</div>
    </div>
  </header>
  <main>
    <section class="stage" id="stage" aria-live="off"></section>
    <section class="panel" id="panel"></section>
  </main>
  <footer>
    <span><span class="clock" id="clock"></span> <span class="hint" id="hint" hidden>· Run the bridge for live mode: <b>bun bridge/serve.ts</b></span></span>
    <span id="keys"><kbd>←</kbd> <kbd>→</kbd> to move · <kbd>R</kbd> to replay the run · <kbd>F</kbd> for full screen</span>
  </footer>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>window.SOURCES = {"plugin.json":"{\n  \"name\": \"agent-orbit\",\n  \"version\": \"0.1.0\",\n  \"description\": \"A live animated view in the terminal: the main session as a core, its agents in orbit, and the files they read flying in\",\n  \"types\": \"./types/index.d.ts\",\n  \"license\": \"MIT\",\n  \"author\": { \"name\": \"Like A Human\" }\n}\n","hooks.json":"{ \"modules\": [\"./register.tsx\"] }\n","register.tsx":"import { atom, read, update } from 'claude-code'\nimport type { EngineInterface, Register } from 'claude-code'\n\nimport { drawSvg } from './desktop'\nimport { drawFrame } from './frame'\nimport type { Agent, Step } from './live'\nimport { AMBER, CYAN, GREEN, LIME, MAIN, PALETTE, baseName, blankAgent, hash, newLive, say, shortModel, verbOf } from './live'\n\nconst PANE = 'agent-orbit'\nconst RASTER = 'orbit'\nconst READS = new Set(['Read', 'Grep', 'Glob', 'WebFetch', 'WebSearch', 'Skill', 'LS'])\n\n// A counter for the text view on surfaces without a Raster.\nconst version = atom({ plugin: 'agent-orbit', key: 'version' } as const, 0)\n\n// The live model and the size of the mounted Raster. Both start over on a reload.\nconst live = newLive(Date.now())\nlet size: { columns: number; rows: number } | undefined\n// True once a desktop pane drew the SVG view, and when it last redrew.\nlet vectorShown = false\nlet lastRedraw = 0\n// Agents whose end the mod already reported to the chat.\nconst reported = new Set<string>()\n\nfunction whatOf(input: Record<string, unknown>, tool: string): string {\n  const value = ['file_path', 'pattern', 'url', 'query', 'skill', 'command', 'description']\n    .map(key => input[key])\n    .find(v => typeof v === 'string')\n  return String(value ?? tool)\n}\n\nfunction loopOf(id: string | undefined): Agent {\n  if (!id) return live.main\n  let agent = live.agents.find(a => a.id === id)\n  if (!agent) {\n    const slot = live.agents.length\n    agent = blankAgent(id, 'agent', Date.now(), slot, PALETTE[slot % PALETTE.length] ?? CYAN)\n    agent.name = `Agent ${slot + 1}`\n    live.agents.push(agent)\n  }\n  return agent\n}\n\n// Step 7: a live web page, like the build board. The mod posts its model to a small\n// bridge (bridge/serve.ts) about 3 times a second while agents run; the bridge streams\n// it to every open page, so the page and the pane draw the same model. The bridge\n// answers each post with the prompts the page queued, and the mod sends them to Claude.\nconst BRIDGE = 'http://127.0.0.1:4747'\nlet lastSent = 0\nlet bridgeDownUntil = 0\n// Who this chat is on the page: the page shows one chip per session, and a button\n// sends its prompt to the session that is selected there.\nconst session = { id: crypto.randomUUID(), label: 'Claude Code', surface: 'terminal' as string }\n\nfunction mirror($: EngineInterface, now: number): void {\n  const busy = live.agents.some(a => a.endedAt === undefined) || now - (live.events[live.events.length - 1]?.at ?? 0) < 3000\n  if (now < bridgeDownUntil || now - lastSent < (busy ? 300 : 3000)) return\n  lastSent = now\n  void $.http\n    .fetch(`${BRIDGE}/state`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ ...live, sentAt: now, session }) })\n    .then(async r => {\n      if (!r.ok) {\n        bridgeDownUntil = now + 5000\n        return\n      }\n      // A prompt from the page goes into the chat as if the person typed it.\n      const { prompts } = JSON.parse(r.text) as { prompts?: string[] }\n      for (const text of prompts ?? []) {\n        say(live, 'The web page sends a prompt to the chat', LIME, Date.now())\n        $.ui.toast('The orbit page sent a prompt to Claude')\n        await $.prompt.submit({ text, asUser: true })\n      }\n    })\n    .catch(() => {\n      bridgeDownUntil = now + 5000\n    })\n}\n\n// Starts the bridge when it does not answer (detached, so it outlives the turn), like /board.\nasync function ensureBridge($: EngineInterface): Promise<boolean> {\n  const up = async () => (await $.http.fetch(`${BRIDGE}/health`).catch(() => ({ ok: false }))).ok\n  if (await up()) return true\n  // The mod sits in <repo>/mods/agent-orbit; the bridge in <repo>/bridge.\n  const start = `cd \"${$.plugin.root}\" && { [ -d .claude-plugin ] || cd ..; } && cd ../.. && nohup bun bridge/serve.ts > /tmp/agent-orbit-bridge.log 2>&1 &`\n  await $.process.run(['sh', '-c', start])\n  for (let i = 0; i < 20; i++) {\n    await $.clock.sleep(500)\n    if (await up()) {\n      bridgeDownUntil = 0\n      return true\n    }\n  }\n  return false\n}\n\nexport const register: Register = on => {\n  on('session.start', async ($, e, next) => {\n    session.surface = e.surface ?? 'terminal'\n    session.label = `${session.surface === 'desktop' ? 'Desktop' : 'CLI'} · ${e.cwd.split('/').pop() ?? ''}`\n    await $.command.register({ name: 'orbit', description: 'Open the live agent orbit; /orbit web opens the live web page' })\n    void $.ui.open({ id: PANE, title: 'Agent orbit' })\n\n    // The animation: about 16 frames a second, painted into the mounted Raster.\n    $.clock.every(60, () => {\n      const now = Date.now()\n      if (size) {\n        const cells = drawFrame(live, size.columns, size.rows, now)\n        void $.ui.blit({ requestId: PANE, key: RASTER, cells, ...size }).catch(() => {})\n      }\n      mirror($, now)\n      // The desktop SVG animates by itself; it only needs a redraw every 2 s while agents run.\n      const busy = live.agents.some(a => a.endedAt === undefined)\n      if (vectorShown && busy && now - lastRedraw > 2000) {\n        lastRedraw = now\n        void update($, version, v => v + 1).catch(() => {})\n      }\n    })\n\n    return next(e)\n  })\n\n  on('command.run', { command: 'orbit' }, async ($, e) => {\n    // `/orbit web` starts the bridge and opens the live page, like `/board`.\n    if (e.args.trim() === 'web') {\n      if (!(await ensureBridge($))) return { text: 'The bridge did not start. See /tmp/agent-orbit-bridge.log (it needs bun).' }\n      await $.process.run(['open', BRIDGE])\n      return { text: `The live orbit page is open: ${BRIDGE}` }\n    }\n    await $.ui.open({ id: PANE, title: 'Agent orbit' })\n    return { text: 'Agent orbit opened. Type /orbit web for the live web page.' }\n  })\n\n  // A prompt the person enters counts as their ask: the pane opens at any width.\n  on('prompt.submit', async ($, e, next) => {\n    void $.ui.open({ id: PANE, title: 'Agent orbit' }).catch(() => {})\n    if (e.origin.kind !== 'plugin') say(live, 'You give Main a task', LIME, Date.now())\n    await update($, version, v => v + 1).catch(() => {})\n    return next(e)\n  })\n\n  // The context the session carries before its first word: its instruction files.\n  on('prompt.context', async ($, e, next) => {\n    live.files = (e.instructionFiles ?? []).map(file => `${file.kind}: ${baseName(file.path)}`)\n    if (live.files.length > 0) say(live, `Main loads ${live.files.length} instruction files (CLAUDE.md)`, CYAN, Date.now())\n    await update($, version, v => v + 1).catch(() => {})\n    return next(e)\n  })\n\n  on('skill.prompt', async ($, e, next) => {\n    if (!live.skills.includes(e.skill)) live.skills.push(e.skill)\n    say(live, `A skill loads: ${e.skill}`, CYAN, Date.now())\n    return next(e)\n  })\n\n  // A new agent: it takes a slot in the orbit, and a star flies out to it.\n  on('agent.spawn', async ($, e, next) => {\n    const started = await next(e)\n    if (started.deny === undefined && started.agentId) {\n      const agent = loopOf(started.agentId)\n      const same = live.agents.filter(a => a.type === e.subagentType).length + 1\n      agent.type = e.subagentType\n      agent.name = `${e.subagentType} ${same}`\n      agent.task = e.description\n      agent.model = shortModel(started.model)\n      agent.startedAt = Date.now()\n      live.particles.push({ kind: 'spawn', agentId: agent.id, label: '', seed: 0, at: Date.now() })\n      say(live, `Main hands ${agent.name} a task: \"${e.description}\" (${agent.model})`, LIME, Date.now())\n      await update($, version, v => v + 1).catch(() => {})\n    }\n    return started\n  })\n\n  // Every tool call: a read flies in from outside, an action reports back to the core.\n  on('tool.call', async ($, e, next) => {\n    const agent = loopOf(e.agentId)\n    const what = whatOf(e as unknown as Record<string, unknown>, e.tool)\n    const step: Step = { tool: e.tool, what: verbOf(e.tool, what), isRead: READS.has(e.tool), at: Date.now() }\n    agent.steps = [...agent.steps, step].slice(-30)\n    if (step.isRead) {\n      agent.reads++\n      const file = baseName(what)\n      agent.context = [...agent.context.filter(f => f !== file), file].slice(-4)\n    } else agent.acts++\n    say(live, `${agent.name} ${step.what}`, step.isRead ? CYAN : AMBER, Date.now())\n    if (agent.id !== MAIN) {\n      live.particles.push({\n        kind: step.isRead ? 'read' : 'act',\n        agentId: agent.id,\n        label: baseName(what),\n        seed: hash(what),\n        at: Date.now(),\n      })\n    }\n    await update($, version, v => v + 1).catch(() => {})\n    return next(e)\n  })\n\n  // An agent ends: it parks with a check mark.\n  on('turn.complete', async ($, e, next) => {\n    if (e.agentId) {\n      const agent = live.agents.find(a => a.id === e.agentId)\n      if (agent && agent.endedAt === undefined) {\n        agent.endedAt = Date.now()\n        const s = Math.round((agent.endedAt - agent.startedAt) / 1000)\n        say(live, `${agent.name} is done after ${s}s: read ${agent.reads}, did ${agent.acts}`, GREEN, Date.now())\n      }\n      await update($, version, v => v + 1).catch(() => {})\n\n      // The mod talks back: when the last running agent ends, it sends a prompt to the chat.\n      const wave = live.agents.filter(a => !reported.has(a.id))\n      if (wave.length > 0 && wave.every(a => a.endedAt !== undefined)) {\n        wave.forEach(a => reported.add(a.id))\n        const lines = wave.map(\n          a => `- ${a.name} (${a.model}), ${Math.round(((a.endedAt ?? 0) - a.startedAt) / 1000)}s, read ${a.reads}, did ${a.acts}: ${a.task}`,\n        )\n        say(live, 'The mod sends a debrief prompt to the chat', LIME, Date.now())\n        await update($, version, v => v + 1).catch(() => {})\n        void $.prompt\n          .submit({\n            text: [\n              `Agent orbit saw ${wave.length} agent(s) finish:`,\n              ...lines,\n              'Give a debrief in at most 4 lines: which agent read the most, and the one finding of each agent.',\n            ].join('\\n'),\n          })\n          .catch(() => {})\n      }\n    }\n    return next(e)\n  })\n\n  on('ui.render', { component: 'Pane', requestId: PANE }, async ($, e) => {\n    // The terminal: one Raster, painted by the clock above.\n    if (e.surface === 'terminal') {\n      const { Raster } = $.ui.resolve(e)\n      const columns = Math.max(20, Math.min(160, e.props.bodyColumns))\n      const rows = Math.max(10, Math.min(48, e.props.scroll.bodyRows))\n      size = { columns, rows }\n      return <Raster key={RASTER} columns={columns} rows={rows} cells={drawFrame(live, columns, rows, Date.now())} />\n    }\n\n    // The desktop: one animated SVG with hover tooltips, drawn again on each change.\n    if (e.surface === 'desktop') {\n      const { Svg } = $.ui.resolve(e)\n      await read($, version)\n      vectorShown = true\n      lastRedraw = Date.now()\n      return <Svg source={drawSvg(live, Date.now())} alt=\"Agent orbit: the main session, its agents, and the files they read\" isInteractive={true} />\n    }\n\n    // Other surfaces: a plain text view of the same model.\n    const { Box, Text } = $.ui.resolve(e)\n    await read($, version)\n    return (\n      <Box flexDirection=\"column\">\n        <Text dimColor>The live orbit draws in the Claude CLI. Here is the list.</Text>\n        {[live.main, ...live.agents].map(agent => (\n          <Text>\n            {agent.endedAt ? 'done' : 'runs'} · {agent.name} {agent.model} · read {agent.reads} · did {agent.acts}\n          </Text>\n        ))}\n        {live.events.slice(-5).map(event => (\n          <Text dimColor>{event.text}</Text>\n        ))}\n      </Box>\n    )\n  })\n}\n","live.ts":"// The live model: what the animation draws. Plain module state, filled by the hooks.\n\nexport type Step = { tool: string; what: string; isRead: boolean; at: number }\n\nexport type Agent = {\n  id: string\n  type: string\n  name: string\n  task: string\n  model: string\n  startedAt: number\n  endedAt?: number\n  slot: number\n  color: number\n  steps: Step[]\n  reads: number\n  acts: number\n  /** The files this agent read: its context, shown as satellites around it. */\n  context: string[]\n}\n\nexport type Particle = {\n  kind: 'spawn' | 'read' | 'act'\n  agentId: string\n  label: string\n  seed: number\n  at: number\n}\n\n/** One thing that happened, in plain words, for the caption and the ticker. */\nexport type Event = { text: string; color: number; at: number }\n\nexport type Live = {\n  main: Agent\n  agents: Agent[]\n  particles: Particle[]\n  events: Event[]\n  files: string[]\n  skills: string[]\n}\n\nexport const MAIN = 'main'\nexport const LIME = 0xc6ff3d\nexport const CYAN = 0x5ee0ff\nexport const AMBER = 0xffc857\nexport const GREEN = 0x6dffa8\n\n// One colour per agent, in order of spawn.\nexport const PALETTE = [0x5ee0ff, 0xff7ad9, 0xffc857, 0x9d8cff, 0x6dffa8, 0xff8f5e, 0x7ab8ff]\n\nexport function newLive(now: number): Live {\n  return {\n    main: blankAgent(MAIN, 'main session', now, -1, LIME),\n    agents: [],\n    particles: [],\n    events: [],\n    files: [],\n    skills: [],\n  }\n}\n\nexport function blankAgent(id: string, type: string, now: number, slot: number, color: number): Agent {\n  return {\n    id,\n    type,\n    name: id === MAIN ? 'Main' : type,\n    task: '',\n    model: '',\n    startedAt: now,\n    slot,\n    color,\n    steps: [],\n    reads: 0,\n    acts: 0,\n    context: [],\n  }\n}\n\nexport function say(live: Live, text: string, color: number, at: number): void {\n  live.events = [...live.events, { text, color, at }].slice(-20)\n}\n\nexport function hash(text: string): number {\n  let h = 2166136261\n  for (let i = 0; i < text.length; i++) h = Math.imul(h ^ text.charCodeAt(i), 16777619)\n  return h >>> 0\n}\n\nexport function shortModel(model: string): string {\n  const m = /(opus|sonnet|haiku|fable)/i.exec(model)\n  return m?.[1] ? m[1].toLowerCase() : model.slice(0, 8)\n}\n\nexport function baseName(text: string): string {\n  return text.split('/').pop()?.slice(0, 22) ?? text\n}\n\n/** A tool call in plain words: \"reads PROBLEMS.md\", \"searches for TODO\". */\nexport function verbOf(tool: string, what: string): string {\n  const name = baseName(what)\n  switch (tool) {\n    case 'Read':\n      return `reads ${name}`\n    case 'Grep':\n      return `searches for \"${what.slice(0, 24)}\"`\n    case 'Glob':\n      return `looks for files ${what.slice(0, 24)}`\n    case 'LS':\n      return `lists ${name}`\n    case 'WebFetch':\n    case 'WebSearch':\n      return `reads the web: ${what.slice(0, 28)}`\n    case 'Skill':\n      return `loads the skill ${what}`\n    case 'Edit':\n    case 'Write':\n      return `edits ${name}`\n    case 'Bash':\n      return `runs ${what.slice(0, 28)}`\n    case 'Agent':\n      return `starts an agent: ${what.slice(0, 28)}`\n    default:\n      return `uses ${tool}`\n  }\n}\n","frame.ts":"// Draws one frame of the orbit into Raster cells: [codePoint, fg, bg] per cell.\nimport type { Agent, Live } from './live'\nimport { AMBER, CYAN, GREEN, LIME, hash, shortModel } from './live'\n\nconst DEFAULT = 0x01000000\nconst SPIN = '⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏'\nconst DIM = 0x4a5568\nconst FAINT = 0x2d3440\nconst TEXT = 0xd8dee9\nconst MUTED = 0x8899aa\n\nfunction scale(color: number, k: number): number {\n  const r = Math.min(255, Math.round(((color >> 16) & 255) * k))\n  const g = Math.min(255, Math.round(((color >> 8) & 255) * k))\n  const b = Math.min(255, Math.round((color & 255) * k))\n  return (r << 16) | (g << 8) | b\n}\n\n// Only width-1 characters: anything wide or outside the BMP becomes '?'.\nfunction safe(code: number): number {\n  if (code < 0x20 || code === 0x7f) return 0x20\n  if (code > 0xffff) return 0x3f\n  if (\n    (code >= 0x1100 && code <= 0x115f) ||\n    (code >= 0x2e80 && code <= 0xa4cf) ||\n    (code >= 0xac00 && code <= 0xd7a3) ||\n    (code >= 0xf900 && code <= 0xfaff) ||\n    (code >= 0xfe30 && code <= 0xfe4f) ||\n    (code >= 0xff00 && code <= 0xff60) ||\n    (code >= 0xffe0 && code <= 0xffe6) ||\n    (code >= 0xd800 && code <= 0xdfff)\n  )\n    return 0x3f\n  return code\n}\n\nfunction clock(ms: number): string {\n  const s = Math.max(0, Math.floor(ms / 1000))\n  return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`\n}\n\nfunction fit(text: string, width: number): string {\n  if (width <= 0) return ''\n  return text.length > width ? `${text.slice(0, Math.max(0, width - 1))}…` : text.padEnd(width)\n}\n\nfunction ago(ms: number): string {\n  const s = Math.floor(ms / 1000)\n  return s < 1 ? 'now' : `${s}s`\n}\n\nexport function drawFrame(live: Live, columns: number, rows: number, now: number): string {\n  const W = Math.max(1, columns)\n  const H = Math.max(1, rows)\n  const narrow = W < 80\n  const cells = new Uint32Array(W * H * 3)\n  for (let i = 0; i < W * H; i++) {\n    cells[i * 3] = 0x20\n    cells[i * 3 + 1] = DEFAULT\n    cells[i * 3 + 2] = DEFAULT\n  }\n  const put = (x: number, y: number, ch: string, fg: number) => {\n    const cx = Math.round(x)\n    const cy = Math.round(y)\n    if (cx < 0 || cy < 0 || cx >= W || cy >= H) return\n    const i = (cy * W + cx) * 3\n    cells[i] = safe(ch.codePointAt(0) ?? 0x20)\n    cells[i + 1] = fg\n  }\n  const write = (x: number, y: number, text: string, fg: number) => {\n    let i = 0\n    for (const ch of text) put(x + i++, y, ch, fg)\n  }\n\n  // The layout, top to bottom: legend, sky, caption, ticker, list.\n  const loops = [live.main, ...live.agents]\n  const tall = H >= 28\n  const perLoop = narrow && tall ? 2 : 1\n  let listRows = Math.min(loops.length * perLoop, Math.max(2, Math.floor(H / 3)))\n  let ticker = H >= 34 ? 3 : H >= 26 ? 2 : 0\n  let skyH = H - 1 - 1 - ticker - 1 - listRows\n  if (skyH < 9) {\n    ticker = 0\n    skyH = H - 3 - listRows\n  }\n  if (skyH < 7) {\n    listRows = Math.max(1, H - 3 - 7)\n    skyH = H - 3 - listRows\n  }\n  const top = 1\n  const cx = W / 2\n  const cy = top + skyH / 2\n  const rx = Math.max(6, Math.min(W * 0.34, skyH * 1.5))\n  const ry = Math.max(2, skyH * 0.34)\n\n  // 1. The legend: what each mark means.\n  const legend: [string, number, string][] = [\n    ['◉', LIME, 'main session'],\n    ['●', 0xff7ad9, 'agent'],\n    ['◆', CYAN, 'reads a file'],\n    ['◆', AMBER, 'acts'],\n    ['★', LIME, 'task out'],\n    ['✔', GREEN, 'done'],\n  ]\n  let lx = 1\n  for (const [mark, color, label] of legend) {\n    const item = narrow ? label.split(' ')[0] ?? label : label\n    if (lx + 3 + item.length > W) break\n    put(lx, 0, mark, color)\n    write(lx + 2, 0, item, MUTED)\n    lx += item.length + 4\n  }\n\n  // 2. The sky: stars that twinkle.\n  for (let s = 0; s < Math.floor((W * skyH) / 50); s++) {\n    const h = hash(`star${s}`)\n    const glow = 0.5 + 0.5 * Math.sin(now / 900 + (h % 628) / 100)\n    put(h % W, top + ((h >>> 12) % skyH), glow > 0.85 ? '+' : '·', scale(0x8899aa, 0.2 + 0.4 * glow))\n  }\n\n  // The orbit itself.\n  for (let a = 0; a < 360; a += 5) {\n    const t = (a * Math.PI) / 180\n    put(cx + rx * Math.cos(t), cy + ry * Math.sin(t), '·', FAINT)\n  }\n\n  // Where each agent is now.\n  const n = Math.max(3, live.agents.length)\n  const where = (agent: Agent, at: number) => {\n    const until = agent.endedAt ?? at\n    const angle = (agent.slot * 2 * Math.PI) / n - Math.PI / 2 + ((until - agent.startedAt) / 1000) * 0.35\n    return { x: cx + rx * Math.cos(angle), y: cy + ry * Math.sin(angle) }\n  }\n\n  // Beams from the core to each running agent, with a dash that flows outward.\n  for (const agent of live.agents) {\n    if (agent.endedAt) continue\n    const p = where(agent, now)\n    const steps = Math.ceil(Math.max(Math.abs(p.x - cx), Math.abs(p.y - cy) * 2))\n    for (let k = 3; k < steps - 1; k++) {\n      const lit = (((k - Math.floor(now / 90)) % 5) + 5) % 5 === 0\n      put(cx + ((p.x - cx) * k) / steps, cy + ((p.y - cy) * k) / steps, lit ? '•' : '·', lit ? agent.color : scale(agent.color, 0.25))\n    }\n  }\n\n  // Particles: a task flies out, a file flies in, an action reports back.\n  live.particles = live.particles.filter(p => now - p.at < 1400)\n  for (const particle of live.particles) {\n    const agent = live.agents.find(a => a.id === particle.agentId)\n    if (!agent) continue\n    const t = Math.min(1, (now - particle.at) / 1100)\n    const ease = 1 - (1 - t) * (1 - t)\n    const target = where(agent, now)\n    if (particle.kind === 'read') {\n      const angle = ((particle.seed % 360) * Math.PI) / 180\n      const sx = cx + rx * 1.4 * Math.cos(angle)\n      const sy = Math.max(top, Math.min(top + skyH - 1, cy + ry * 1.4 * Math.sin(angle)))\n      const x = sx + (target.x - sx) * ease\n      const y = sy + (target.y - sy) * ease\n      put(x - (target.x - sx) * 0.07, y - (target.y - sy) * 0.07, '·', scale(CYAN, 0.5))\n      put(x, y, '◆', CYAN)\n      if (t < 0.55) {\n        const label = particle.label\n        write(Math.max(0, Math.min(W - label.length, x - label.length / 2)), Math.max(top, y - 1), label, scale(CYAN, 1 - t))\n      }\n    } else {\n      const from = particle.kind === 'spawn' ? { x: cx, y: cy } : target\n      const to = particle.kind === 'spawn' ? target : { x: cx, y: cy }\n      put(from.x + (to.x - from.x) * ease, from.y + (to.y - from.y) * ease, particle.kind === 'spawn' ? '★' : '◆', particle.kind === 'spawn' ? LIME : AMBER)\n    }\n  }\n\n  // The core: the main session, pulsing, with its own context under it.\n  const beat = 0.6 + 0.4 * Math.sin(now / 260)\n  for (let a = 0; a < 360; a += 30) {\n    const t = (a * Math.PI) / 180 + now / 1200\n    put(cx + 3.2 * Math.cos(t), cy + 1.4 * Math.sin(t), '·', scale(LIME, 0.3 + 0.4 * beat))\n  }\n  put(cx, cy, '◉', scale(LIME, 0.55 + 0.45 * beat))\n  write(cx - 2, cy + 2, 'MAIN', LIME)\n  const mainContext = live.files.length > 0 ? live.files : live.main.context\n  mainContext.slice(0, skyH >= 14 ? 2 : 0).forEach((file, i) => {\n    const label = `◇ ${file}`\n    if (cy + 3 + i < top + skyH) write(cx - Math.floor(label.length / 2), cy + 3 + i, label, scale(LIME, 0.5))\n  })\n\n  // 3. The agents: a trail, the name, and the files it read as satellites (its context).\n  for (const agent of live.agents) {\n    const done = agent.endedAt !== undefined\n    if (!done) {\n      for (let k = 4; k >= 1; k--) {\n        const p = where(agent, now - k * 160)\n        put(p.x, p.y, '·', scale(agent.color, 0.7 - k * 0.14))\n      }\n    }\n    const p = where(agent, now)\n    const blink = done ? 1 : 0.65 + 0.35 * Math.sin(now / 180 + agent.slot)\n    put(p.x, p.y, done ? '✔' : '●', done ? GREEN : scale(agent.color, blink))\n    const name = fit(agent.name, narrow ? 12 : 18).trimEnd()\n    // Labels go on the outer side, unless that side has no room for them.\n    const right = p.x >= cx ? p.x + 2 + name.length <= W : p.x - 1 - name.length < 0\n    const nx = right ? p.x + 2 : p.x - 1 - name.length\n    write(nx, p.y, name, done ? scale(GREEN, 0.8) : agent.color)\n    agent.context.slice(skyH >= 14 ? -3 : -1).forEach((file, i) => {\n      const y = p.y + 1 + i\n      if (y >= top + skyH) return\n      const label = fit(`◇ ${file}`, narrow ? 14 : 22).trimEnd()\n      const sx = right ? p.x + 2 : p.x - 1 - label.length\n      write(sx, y, label, scale(agent.color, done ? 0.4 : 0.6))\n    })\n  }\n\n  // 4. The caption: the newest event in plain words, typed out.\n  let y = top + skyH\n  const newest = live.events[live.events.length - 1]\n  if (newest) {\n    const shown = newest.text.slice(0, Math.max(1, Math.floor((now - newest.at) / 12)))\n    const fresh = now - newest.at < 1500\n    put(1, y, '▶', fresh ? newest.color : scale(newest.color, 0.6))\n    write(3, y, fit(shown, W - 4), fresh ? TEXT : scale(TEXT, 0.75))\n  } else {\n    write(3, y, fit('Waiting for a prompt. Give Claude a task with agents.', W - 4), DIM)\n  }\n  y++\n\n  // 5. The ticker: what happened just before, with how long ago.\n  const older = live.events.slice(-1 - ticker, -1).reverse()\n  for (let i = 0; i < ticker; i++) {\n    const event = older[i]\n    if (event) {\n      write(1, y, fit(ago(now - event.at), 4), DIM)\n      write(6, y, fit(event.text, W - 7), scale(event.color, 0.55 - i * 0.1))\n    }\n    y++\n  }\n\n  // 6. The list: one live row per loop.\n  const running = live.agents.filter(a => !a.endedAt).length\n  const head = ` AGENTS ${running} running · ${live.agents.length - running} done `\n  for (let x = 0; x < W; x++) put(x, y, '─', FAINT)\n  write(1, y, head, LIME)\n  y++\n\n  const spin = SPIN[Math.floor(now / 80) % SPIN.length] ?? '·'\n  for (const agent of loops) {\n    if (y >= H) break\n    const done = agent.endedAt !== undefined\n    const last = agent.steps[agent.steps.length - 1]\n    const lastText = last ? last.what : agent.task || 'starts…'\n    put(1, y, done ? '✔' : spin, done ? GREEN : agent.color)\n    if (!narrow) {\n      write(3, y, fit(agent.name, 16), done ? DIM : TEXT)\n      write(20, y, fit(shortModel(agent.model), 7), DIM)\n      write(28, y, clock((agent.endedAt ?? now) - agent.startedAt), done ? DIM : AMBER)\n      write(35, y, fit(`↓${agent.reads} ↑${agent.acts}`, 9), MUTED)\n      write(45, y, fit(lastText, W - 46), done ? DIM : scale(agent.color, 0.9))\n    } else if (tall) {\n      write(3, y, fit(agent.name, 12), done ? DIM : TEXT)\n      write(16, y, clock((agent.endedAt ?? now) - agent.startedAt), done ? DIM : AMBER)\n      write(23, y, fit(`↓${agent.reads} ↑${agent.acts}`, W - 24), MUTED)\n      if (y + 1 < H) {\n        y++\n        write(3, y, fit(lastText, W - 4), done ? DIM : scale(agent.color, 0.9))\n      }\n    } else {\n      // A short, narrow pane: one row per loop, the last step after the timer.\n      write(3, y, fit(agent.name, 11), done ? DIM : TEXT)\n      write(15, y, clock((agent.endedAt ?? now) - agent.startedAt), done ? DIM : AMBER)\n      write(21, y, fit(lastText, W - 22), done ? DIM : scale(agent.color, 0.9))\n    }\n    y++\n  }\n\n  return (new Uint8Array(cells.buffer) as unknown as { toBase64(): string }).toBase64()\n}\n","desktop.ts":"// The desktop view: one animated SVG, drawn again on each change.\n// Every animation starts at a negative offset (its phase at `now`), so a redraw\n// continues the motion instead of starting it over.\nimport type { Agent, Live } from './live'\nimport { AMBER, CYAN, GREEN, LIME, shortModel } from './live'\n\nconst VW = 760\nconst VH = 540\nconst CX = 400\nconst CY = 228\nconst RX = 235\nconst RY = 140\n\nconst hex = (c: number) => `#${c.toString(16).padStart(6, '0')}`\n\nfunction esc(text: string): string {\n  return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\"/g, '&quot;')\n}\n\nfunction cut(text: string, max: number): string {\n  return text.length > max ? `${text.slice(0, max - 1)}…` : text\n}\n\n// The phase of a repeating animation at `now`, as a negative SMIL begin.\nfunction phase(now: number, ms: number, shift = 0): string {\n  return `-${((now + shift) % ms) / 1000}s`\n}\n\nfunction spot(agent: Agent, count: number) {\n  const n = Math.max(3, count)\n  const angle = (agent.slot * 2 * Math.PI) / n - Math.PI / 2 + 0.35\n  return { x: CX + RX * Math.cos(angle), y: CY + RY * Math.sin(angle), angle }\n}\n\nexport function drawSvg(live: Live, now: number): string {\n  const out: string[] = []\n  const running = live.agents.filter(a => a.endedAt === undefined).length\n  const done = live.agents.length - running\n\n  out.push(`<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 ${VW} ${VH}\" width=\"${VW}\" height=\"${VH}\" font-family=\"ui-sans-serif, -apple-system, 'Inter', sans-serif\">`)\n  out.push(`<defs>\n    <radialGradient id=\"sky\" cx=\"50%\" cy=\"42%\" r=\"75%\"><stop offset=\"0\" stop-color=\"#16213a\"/><stop offset=\"0.6\" stop-color=\"#0b1020\"/><stop offset=\"1\" stop-color=\"#05070d\"/></radialGradient>\n    <radialGradient id=\"core\" cx=\"50%\" cy=\"50%\" r=\"50%\"><stop offset=\"0\" stop-color=\"#f4ffd0\"/><stop offset=\"0.45\" stop-color=\"${hex(LIME)}\"/><stop offset=\"1\" stop-color=\"${hex(LIME)}\" stop-opacity=\"0\"/></radialGradient>\n    <filter id=\"glow\" x=\"-80%\" y=\"-80%\" width=\"260%\" height=\"260%\"><feGaussianBlur stdDeviation=\"5\" result=\"b\"/><feMerge><feMergeNode in=\"b\"/><feMergeNode in=\"SourceGraphic\"/></feMerge></filter>\n    <filter id=\"soft\" x=\"-50%\" y=\"-50%\" width=\"200%\" height=\"200%\"><feGaussianBlur stdDeviation=\"2.2\"/></filter>\n  </defs>\n  <style>\n    .label { fill: #e6ebf5; font-size: 13px; font-weight: 600; }\n    .sub { fill: #8b98b3; font-size: 11px; }\n    .chip { fill: #c9d4ea; font-size: 10.5px; font-family: ui-monospace, 'SF Mono', Menlo, monospace; }\n    .agent:hover .halo { opacity: 0.55; }\n    .agent { cursor: default; }\n  </style>`)\n\n  // The sky: a deep gradient with twinkling stars.\n  out.push(`<rect x=\"0\" y=\"0\" width=\"${VW}\" height=\"${VH}\" rx=\"18\" fill=\"url(#sky)\"/>`)\n  for (let s = 0; s < 70; s++) {\n    const h = Math.imul(s + 1, 2654435761) >>> 0\n    const x = h % VW\n    const y = (h >>> 11) % 400\n    const r = 0.5 + ((h >>> 5) % 10) / 10\n    const dur = 2400 + (h % 3000)\n    out.push(`<circle cx=\"${x}\" cy=\"${y}\" r=\"${r}\" fill=\"#cfe1ff\"><animate attributeName=\"opacity\" values=\"0.1;0.8;0.1\" dur=\"${dur}ms\" begin=\"${phase(now, dur, h % 1000)}\" repeatCount=\"indefinite\"/></circle>`)\n  }\n\n  // The legend and the header.\n  const legend: [string, string][] = [\n    [hex(LIME), 'main session'],\n    ['#ff7ad9', 'agent'],\n    [hex(CYAN), 'reads a file'],\n    [hex(AMBER), 'acts'],\n    [hex(GREEN), 'done'],\n  ]\n  let lx = 22\n  for (const [color, label] of legend) {\n    out.push(`<circle cx=\"${lx}\" cy=\"24\" r=\"4.5\" fill=\"${color}\" filter=\"url(#glow)\"/><text x=\"${lx + 10}\" y=\"28\" class=\"sub\">${label}</text>`)\n    lx += 22 + label.length * 6.2\n  }\n  out.push(`<text x=\"${VW - 22}\" y=\"28\" text-anchor=\"end\" class=\"sub\"><tspan fill=\"${hex(LIME)}\" font-weight=\"700\">${running}</tspan> running · <tspan fill=\"${hex(GREEN)}\" font-weight=\"700\">${done}</tspan> done · ${live.files.length || live.main.context.length} context files</text>`)\n\n  // The orbit: a slow, flowing dashed ring.\n  out.push(`<ellipse cx=\"${CX}\" cy=\"${CY}\" rx=\"${RX}\" ry=\"${RY}\" fill=\"none\" stroke=\"#2a3b5f\" stroke-width=\"1.2\" stroke-dasharray=\"2 7\"><animate attributeName=\"stroke-dashoffset\" from=\"0\" to=\"-90\" dur=\"6s\" begin=\"${phase(now, 6000)}\" repeatCount=\"indefinite\"/></ellipse>`)\n\n  // The chat: where the person types, and where the mod talks back.\n  const chat = { x: 70, y: CY }\n  const lastIn = [...live.events].reverse().find(e => e.text.startsWith('You give Main'))\n  const lastOut = [...live.events].reverse().find(e => e.text.startsWith('The mod sends'))\n  out.push(`<g><title>The chat: you give Main a task here, and the mod sends its debrief here.</title>\n    <rect x=\"${chat.x - 46}\" y=\"${chat.y - 22}\" width=\"92\" height=\"44\" rx=\"12\" fill=\"#121a2e\" stroke=\"#33466e\"/>\n    <text x=\"${chat.x}\" y=\"${chat.y - 2}\" text-anchor=\"middle\" class=\"label\">CHAT</text>\n    <text x=\"${chat.x}\" y=\"${chat.y + 13}\" text-anchor=\"middle\" class=\"sub\">you + Claude</text></g>`)\n  out.push(`<path id=\"chatline\" d=\"M ${chat.x + 46} ${chat.y} L ${CX - 30} ${CY}\" stroke=\"#2a3b5f\" stroke-width=\"1\" stroke-dasharray=\"3 5\" fill=\"none\"/>`)\n  for (const [event, color, reverse] of [[lastIn, LIME, false], [lastOut, LIME, true]] as const) {\n    if (!event || now - event.at > 2200) continue\n    const path = reverse ? `M ${CX - 30} ${CY} L ${chat.x + 46} ${chat.y}` : `M ${chat.x + 46} ${chat.y} L ${CX - 30} ${CY}`\n    out.push(`<circle r=\"6\" fill=\"${hex(color)}\" filter=\"url(#glow)\" opacity=\"0\"><animateMotion path=\"${path}\" dur=\"1.4s\" begin=\"-${(now - event.at) / 1000}s\" fill=\"freeze\"/><animate attributeName=\"opacity\" values=\"0;1;1;0\" dur=\"1.4s\" begin=\"-${(now - event.at) / 1000}s\" fill=\"freeze\"/></circle>`)\n  }\n\n  // Beams from the core to each agent: flowing while it runs, faint when it is done.\n  for (const agent of live.agents) {\n    const p = spot(agent, live.agents.length)\n    const isDone = agent.endedAt !== undefined\n    const c = hex(isDone ? GREEN : agent.color)\n    out.push(`<line x1=\"${CX}\" y1=\"${CY}\" x2=\"${p.x}\" y2=\"${p.y}\" stroke=\"${c}\" stroke-opacity=\"${isDone ? 0.18 : 0.55}\" stroke-width=\"${isDone ? 1 : 1.6}\" stroke-dasharray=\"${isDone ? '0' : '4 10'}\">${isDone ? '' : `<animate attributeName=\"stroke-dashoffset\" from=\"0\" to=\"-28\" dur=\"0.9s\" begin=\"${phase(now, 900)}\" repeatCount=\"indefinite\"/>`}</line>`)\n  }\n\n  // The core: the main session, with rings that pulse outward.\n  for (let k = 0; k < 3; k++) {\n    out.push(`<circle cx=\"${CX}\" cy=\"${CY}\" r=\"26\" fill=\"none\" stroke=\"${hex(LIME)}\" stroke-width=\"1.5\"><animate attributeName=\"r\" values=\"26;62\" dur=\"2.4s\" begin=\"${phase(now, 2400, k * 800)}\" repeatCount=\"indefinite\"/><animate attributeName=\"opacity\" values=\"0.7;0\" dur=\"2.4s\" begin=\"${phase(now, 2400, k * 800)}\" repeatCount=\"indefinite\"/></circle>`)\n  }\n  const mainCtx = (live.files.length > 0 ? live.files : live.main.context).slice(0, 3)\n  out.push(`<g><title>Main session. Context it carries: ${esc(mainCtx.join(', ') || 'none seen yet')}. Reads ${live.main.reads}, actions ${live.main.acts}.</title>\n    <circle cx=\"${CX}\" cy=\"${CY}\ // ---------- syntax colours ----------
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
const KW = 'import|from|export|const|let|function|return|if|else|for|of|await|async|new|type|void|true|false|undefined|continue|break|as|in|switch|case|default|null'
const TOKEN = new RegExp([
  '(\\/\\/.*$)',
  '(`(?:\\\\.|[^`\\\\])*`?|\'(?:\\\\.|[^\'\\\\])*\'|"(?:\\\\.|[^"\\\\])*")',
  `(\\b(?:${KW})\\b)`,
  '(\\b0x[0-9a-fA-F]+\\b|\\b\\d[\\d_.]*\\b)',
  '(<\\/?[A-Z][A-Za-z]*)',
  '(\\$(?:\\.[A-Za-z]+)+)',
  '([A-Za-z_][\\w]*)(?=\\s*\\()',
].join('|'), 'g')
function colour(line, json) {
  let out = '', last = 0, m
  TOKEN.lastIndex = 0
  while ((m = TOKEN.exec(line))) {
    out += esc(line.slice(last, m.index))
    const [t, com, str, kw, num, tag, dol, fn] = m
    let cls = com ? 't-com' : str ? (json && /^\s*:/.test(line.slice(m.index + t.length)) ? 't-key' : 't-str') : kw ? 't-kw' : num ? 't-num' : tag ? 't-tag' : dol ? 't-dol' : 't-fn'
    out += `<span class="${cls}">${esc(t)}</span>`
    last = m.index + t.length
    if (t.length === 0) TOKEN.lastIndex++
  }
  return out + esc(line.slice(last))
}

function codeHtml(step) {
  let mark = 0
  const notes = []
  const blocks = step.blocks.map(b => {
    const isJson = (b.file || '').endsWith('.json')
    let rows = []
    if (b.text) {
      b.text.split('\n').forEach((src, i) => {
        const note = b.hlRel && b.hlRel[i + 1]
        if (note) notes.push(note)
        rows.push(`<div class="ln${note ? ' hl' : ''}"><span class="no">·</span><span class="mk">${note ? ++mark : ''}</span><span class="src">${colour(src, false) || ' '}</span></div>`)
      })
    } else {
      const all = S[b.file].split('\n')
      // Dedent the excerpt by its smallest indent, so the code gets the width.
      const picked = b.lines.flatMap(([f, t]) => all.slice(f - 1, t)).filter(l => l.trim())
      const cut = Math.min(...picked.map(l => l.match(/^ */)[0].length))
      b.lines.forEach(([from, to], k) => {
        if (k > 0) rows.push(`<div class="gap">⋯</div>`)
        for (let n = from; n <= to; n++) {
          const note = b.hl && b.hl[n]
          if (note) notes.push(note)
          rows.push(`<div class="ln${note ? ' hl' : ''}"><span class="no">${n}</span><span class="mk">${note ? ++mark : ''}</span><span class="src">${colour((all[n - 1] ?? '').slice(cut), isJson) || ' '}</span></div>`)
        }
      })
    }
    const kind = isJson ? 'json' : 'ts'
    return `<div class="block"><div class="tab ${kind}">${b.path}${b.tag ? `<em>${b.tag}</em>` : ''}</div><pre>${rows.join('')}</pre></div>`
  })
  // Blocks marked `pair` sit side by side.
  const parts = []
  step.blocks.forEach((b, k) => {
    if (b.pair && step.blocks[k - 1]?.pair) parts[parts.length - 1].push(blocks[k])
    else parts.push([blocks[k]])
  })
  const html = parts.map(p => p.length > 1 ? `<div class="pair">${p.join('')}</div>` : p[0]).join('')
  return { html, notes }
}

// The grid: as many cells as fit the pane, clamped like register.tsx does (20-160 × 10-48).
let grid = null
function sizeCanvas() {
  const r = view.body.getBoundingClientRect()
  const lh = Math.max(13, Math.min(22, r.height / 35))
  const font = lh / 1.24
  const ctx = view.sharp.getContext('2d')
  ctx.font = `500 ${font}px 'JetBrains Mono', monospace`
  const cw = ctx.measureText('M').width
  const columns = Math.max(20, Math.min(160, Math.floor(r.width / cw)))
  const rows = Math.max(10, Math.min(48, Math.floor(r.height / lh)))
  const dpr = devicePixelRatio || 1
  for (const c of [view.sharp, view.bloom]) {
    c.width = Math.round(columns * cw * dpr); c.height = Math.round(rows * lh * dpr)
    c.style.width = columns * cw + 'px'; c.style.height = rows * lh + 'px'
  }
  grid = { columns, rows, cw, lh, font, dpr }
}

// Step 3 has no explain layer yet: blank the legend row and the empty caption row.
function blankExplain(cells, columns, rows) {
  const blankRow = y => { for (let x = 0; x < columns; x++) cells[(y * columns + x) * 3] = 0x20 }
  blankRow(0)
  for (let y = 1; y < rows; y++) {
    let t = ''
    for (let x = 3; x < 10 && x < columns; x++) t += String.fromCodePoint(cells[(y * columns + x) * 3])
    if (t.startsWith('Waiting')) blankRow(y)
  }
}
const hex = c => '#' + (c & 0xffffff).toString(16).padStart(6, '0')
function paintCells(live) {
  const { columns, rows, cw, lh, font, dpr } = grid
  const cells = O.frameCells(live, columns, rows, Date.now())
  if (!liveOn && STEPS[step].mode === 'bare') blankExplain(cells, columns, rows)
  const ctx = view.sharp.getContext('2d')
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
  ctx.clearRect(0, 0, columns * cw, rows * lh)
  ctx.font = `500 ${font}px 'JetBrains Mono', monospace`
  ctx.textBaseline = 'middle'
  ctx.textAlign = 'center'
  let last = -1
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < columns; x++) {
      const i = (y * columns + x) * 3
      const ch = cells[i]
      if (ch === 0x20) continue
      const fg = cells[i + 1] === 0x01000000 ? 0xc8d0e0 : cells[i + 1]
      if (fg !== last) { ctx.fillStyle = hex(fg); last = fg }
      ctx.fillText(String.fromCodePoint(ch), x * cw + cw / 2, y * lh + lh / 2 + 1)
    }
  }
  const b = view.bloom.getContext('2d')
  b.setTransform(1, 0, 0, 1, 0, 0)
  b.clearRect(0, 0, view.bloom.width, view.bloom.height)
  b.drawImage(view.sharp, 0, 0)
  view.meta.textContent = `${columns}×${rows} cells`
}

function paintSvg(model = run.live) {
  if (!view.svg) return
  view.svg.innerHTML = O.drawSvg(model, Date.now())
}

function paintRows() {
  const live = run.live
  const loops = [live.main, ...live.agents]
  const rowsHtml = loops.map(a => {
    const last = a.steps[a.steps.length - 1]
    const fresh = last && Date.now() - last.at < 400
    return `<div class="row${fresh ? ' flash' : ''}"><span class="${a.endedAt ? 'done' : 'runs'}">${a.endedAt ? 'done' : 'runs'}</span><span>${esc(a.name)}</span><span>${esc(a.model || '·')}</span><span>read <span class="n">${a.reads}</span></span><span>did <span class="a">${a.acts}</span></span><span class="last">${esc(last ? last.what : a.task || 'waits')}</span></div>`
  }).join('')
  view.rows.innerHTML = `<div class="note">// the live model, as text rows</div>${rowsHtml}`
  view.meta.textContent = `${live.agents.length} agents`
}

function paintChat() {
  const live = run.live
  view.msgs.innerHTML = run.chat.map(m => {
    if (m.kind === 'user') return `<div class="msg user">${esc(m.text)}</div>`
    if (m.kind === 'agent') {
      const a = live.agents.find(x => x.id === m.agentId)
      const done = a.endedAt !== undefined
      const s = Math.round(((a.endedAt ?? Date.now()) - a.startedAt) / 1000)
      return `<div class="msg agent"><span class="mark ${done ? 'done' : 'run'}">⏺</span> ${esc(a.type)}(${esc(a.task)})<div class="sub">⎿ ${done ? `Done · ${a.reads} reads · ${a.acts} actions · ${s}s` : `Running on ${esc(a.model)}…`}</div></div>`
    }
    if (m.kind === 'plugin') return `<div class="msg plugin"><span class="who">The agent-orbit plugin sent a message:</span>${esc(m.text)}</div>`
    return `<div class="msg claude"><span class="mark">⏺</span> ${esc(m.text)}</div>`
  }).join('')
  // Old messages keep their place without a new entrance.
  ;[...view.msgs.children].forEach((el, k) => { if (k < seen) el.style.animation = 'none' })
  seen = view.msgs.children.length
}
let seen = 0

// ---------- the run ----------
let lastFrame = 0, lastSvg = 0
function startRun() {
  const s = STEPS[step]
  run = new O.Run(step === 0 || !!s.talkBack)
  seen = 0
  lastSvg = 0
  if (view.msgs) view.msgs.innerHTML = ''
  if (view.pane) view.pane.classList.add('closed')
  if (view.svg) paintSvg()
}

function loop() {
  requestAnimationFrame(loop)
  if (liveOn && liveModel) { liveTick(Date.now()); return }
  if (!run) return
  const now = Date.now()
  if (run.elapsed(now) > O.LENGTH) startRun()
  const changed = run.tick(now)
  const mode = step === 0 ? 'svg' : STEPS[step].mode
  if (changed) {
    if (view.msgs) paintChat()
    // prompt.submit opens the pane.
    if (view.pane && run.live.events.length > 0) view.pane.classList.remove('closed')
  }
  if (mode === 'svg') {
    // Like the mod: draw on each change, and every 2 s while agents run.
    if (changed || (run.busy() && now - lastSvg > 2000) || lastSvg === 0) { paintSvg(); lastSvg = now }
  } else if (mode === 'rows') {
    if (changed || now - lastFrame > 400) { paintRows(); lastFrame = now }
  } else if (mode === 'bare' || mode === 'raster') {
    // Like $.clock.every(60, …): one frame each 60 ms.
    if (now - lastFrame >= 60) { paintCells(mode === 'bare' ? O.bare(run.live) : run.live); lastFrame = now }
  }
  const t = Math.min(O.LENGTH, run.elapsed(now))
  document.getElementById('clock').innerHTML = `simulated run <i>${t.toFixed(1)}s</i> / ${O.LENGTH}s`
}

function go(i) {
  leaveLive()
  i = Math.max(0, Math.min(6, i))
  step = i
  renderRail(i)
  mount(i)
  renderPanel(i)
  startRun()
  try { history.replaceState(null, '', '#' + i) } catch {}
}

addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return
  if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return
  if (e.key === 'l' || e.key === 'L') { if (liveModel) enterLive(); return }
  if (liveOn) {
    if (e.key === 't' || e.key === 'T') { liveView = liveView === 'svg' ? 'term' : 'svg'; mountLive(); return }
    if (e.key === 's' || e.key === 'S') { go(step); return }
    if (e.key === 'Tab' && sessions.size > 1) {
      e.preventDefault()
      const ids = [...sessions.keys()]
      select(ids[(ids.indexOf(selectedId) + (e.shiftKey ? ids.length - 1 : 1)) % ids.length], true)
      return
    }
    if (e.key === 'r' || e.key === 'R') return
  }
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); go(step + 1) }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(step - 1) }
  else if (/^[0-6]$/.test(e.key)) go(+e.key)
  else if (e.key === 'r' || e.key === 'R') startRun()
  else if (e.key === 'f' || e.key === 'F') {
    if (document.fullscreenElement) document.exitFullscreen?.()
    else document.documentElement.requestFullscreen?.().catch(() => {})
  }
})

addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (view && view.sharp) sizeCanvas(); fitCode() }, 120) })

// ---------- live mode: the same model, from a real Claude Code session ----------
// The bridge streams the mod's Live model over SSE (GET /events). The page then draws it
// with the same drawSvg / drawFrame, and animates between messages with Date.now().
let liveModel = null, liveOn = false, liveView = 'svg', lastMsg = 0, liveChanged = false, everLive = false
// Two chats at once: the latest model per session.id, and which one the view draws.
const sessions = new Map() // id -> { id, label, surface, model, lastMsg }
let selectedId = null, pinned = false
const chipsEl = document.getElementById('chips')
const ICON = {
  terminal: '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x=".75" y="1.75" width="12.5" height="10.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M3.5 5.2 5.6 7 3.5 8.8M7 9h3.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  desktop: '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x=".75" y="1.5" width="12.5" height="8.5" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M5 12.6h4M7 10v2.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>',
}
const newestAt = s => { const ev = s.model.events; return ev.length ? ev[ev.length - 1].at : 0 }
function selected() { return sessions.get(selectedId) }
function select(id, byPerson) {
  if (!sessions.has(id)) return
  if (byPerson) pinned = true
  if (id !== selectedId) {
    selectedId = id
    liveModel = sessions.get(id).model
    lastMsg = sessions.get(id).lastMsg
    liveChanged = true
    lastSvg = 0
  }
  renderChips()
}
function renderChips() {
  const now = Date.now()
  const list = [...sessions.values()]
  const key = list.map(s => s.id).join('|')
  if (chipsEl.dataset.key !== key) {
    chipsEl.dataset.key = key
    chipsEl.innerHTML = list.map(s => `<button class="sess" role="tab" data-id="${esc(s.id)}"></button>`).join('')
    liveKeys()
    chipsEl.querySelectorAll('.sess').forEach(b => b.addEventListener('click', () => { select(b.dataset.id, true); if (!liveOn) enterLive() }))
  }
  chipsEl.querySelectorAll('.sess').forEach(b => {
    const s = sessions.get(b.dataset.id)
    if (!s) return
    const running = s.model.agents.filter(a => a.endedAt === undefined).length
    const html = `${ICON[s.surface] || ICON.terminal}<span>${esc(s.label)}</span><span class="n${running ? '' : ' zero'}">${running}</span>`
    if (b.innerHTML !== html) b.innerHTML = html
    b.classList.toggle('on', s.id === selectedId)
    b.classList.toggle('stale', now - s.lastMsg > 30000)
    b.setAttribute('aria-selected', String(s.id === selectedId))
    b.title = `${s.label} (${s.surface}) · ${running} running${now - s.lastMsg > 30000 ? ' · no message for 30 s' : ''}`
  })
}
setInterval(() => { if (sessions.size) renderChips() }, 1000)
const badge = document.getElementById('badge')
const hint = document.getElementById('hint')
const keysEl = document.getElementById('keys')
const tutorialKeys = keysEl.innerHTML
badge.addEventListener('click', () => { if (liveModel) enterLive() })

function setBadge(state) {
  badge.classList.add('show')
  badge.classList.toggle('idle', state !== 'live')
  badge.querySelector('span').textContent = state === 'live'
    ? (liveOn ? 'LIVE · connected to Claude Code' : 'LIVE session · press L')
    : 'reconnecting to Claude Code…'
}

function connect() {
  if (!/^https?:$/.test(location.protocol) || typeof EventSource === 'undefined') { hint.hidden = false; return }
  let es
  const open = () => {
    es = new EventSource('/events')
    es.onmessage = ev => {
      let data
      try { data = JSON.parse(ev.data) } catch { return }
      if (!data || !data.main || !Array.isArray(data.agents)) return
      delete data.sentAt
      const info = data.session && data.session.id ? data.session : { id: 'default', label: 'Claude Code', surface: 'terminal' }
      delete data.session
      // JSON has no undefined: a null endedAt still means "runs".
      for (const a of [data.main, ...data.agents]) if (a.endedAt == null) delete a.endedAt
      for (const k of ['particles', 'events', 'files', 'skills']) if (!Array.isArray(data[k])) data[k] = []
      const first = !liveModel
      const now = Date.now()
      sessions.set(info.id, { id: info.id, label: info.label || info.id, surface: info.surface || 'terminal', model: data, lastMsg: now })
      // Until the person clicks a chip, follow the session with the newest event.
      let want = selectedId && sessions.has(selectedId) ? selectedId : info.id
      if (!pinned) for (const s of sessions.values()) if (newestAt(s) > newestAt(sessions.get(want))) want = s.id
      if (want !== selectedId) select(want, false)
      else renderChips()
      if (info.id === selectedId) {
        liveModel = data
        lastMsg = now
        liveChanged = true
      }
      everLive = true
      hint.hidden = true
      if (first) enterLive()
      else setBadge('live')
    }
    es.onerror = () => {
      if (!everLive) { es.close(); hint.hidden = false; return } // no bridge: stay in tutorial mode
      setBadge('down')
      // EventSource retries by itself; when it gives up, try again quietly.
      if (es.readyState === EventSource.CLOSED) setTimeout(open, 3000)
    }
  }
  open()
  setTimeout(() => { if (!liveModel) hint.hidden = false }, 2000)
}

function enterLive() {
  liveOn = true
  setBadge('live')
  mountLive()
}

function leaveLive() {
  if (!liveOn) return
  liveOn = false
  document.body.classList.remove('live')
  keysEl.innerHTML = tutorialKeys
  if (liveModel) setBadge('live')
}

function mountLive() {
  document.body.classList.add('intro', 'live')
  ;[...rail.querySelectorAll('button')].forEach(b => { b.className = ''; b.setAttribute('aria-current', 'false') })
  panel.innerHTML = ''
  const wait = `<div class="wait" hidden>waiting for the session…</div>`
  stage.innerHTML = liveView === 'svg'
    ? `<div class="view enter livev"><div class="svgwrap"></div>${wait}</div>`
    : `<div class="view enter livev"><div class="win term">
        <div class="bar"><span class="dots"><i></i><i></i><i></i></span><span class="grow">Agent orbit · the terminal view of the live session</span></div>
        <div class="pane"><div class="pane-title"><b>Agent orbit</b><span class="meta"></span></div><div class="pane-body"><canvas class="cells bloom"></canvas><canvas class="cells sharp"></canvas></div></div>
      </div>${wait}</div>`
  stage.querySelector('.livev').insertAdjacentHTML('beforeend', `<form class="ctl" id="ctl" autocomplete="off">
    <button type="button" class="primary" data-text="${esc(O.PROMPT)}">Run the demo</button>
    <button type="button" data-text="Give a debrief of the agents that just ran, in at most 4 lines.">Ask for a debrief</button>
    <input name="free" placeholder="Type a prompt for Claude Code" aria-label="A prompt for Claude Code">
    <button type="submit">Send</button>
  </form>`)
  const ctl = document.getElementById('ctl')
  ctl.querySelectorAll('button[data-text]').forEach(b => b.addEventListener('click', () => sendPrompt(b.dataset.text, b)))
  ctl.addEventListener('submit', ev => {
    ev.preventDefault()
    const input = ctl.elements.free
    const text = input.value.trim()
    if (!text) { input.focus(); return }
    sendPrompt(text, ctl.querySelector('button[type=submit]')).then(ok => { if (ok) input.value = '' })
  })
  const q = sel => stage.querySelector(sel)
  view = { svg: q('.svgwrap'), sharp: q('canvas.sharp'), bloom: q('canvas.bloom'), body: q('.pane-body'), meta: q('.pane-title .meta') }
  if (view.sharp) sizeCanvas()
  lastSvg = 0
  lastFrame = 0
  liveKeys()
}
function liveKeys() {
  if (!liveOn) return
  keysEl.innerHTML = `${sessions.size > 1 ? '<kbd>Tab</kbd> for the next chat · ' : ''}<kbd>T</kbd> ${liveView === 'svg' ? 'for the terminal view' : 'for the desktop view'} · <kbd>S</kbd> for the steps · <kbd>F</kbd> for full screen`
}

// Two-way: the bridge queues the prompt, and the mod submits it into the chat.
let toastT
function toast(text, isError) {
  const t = document.getElementById('toast')
  t.textContent = text
  t.classList.toggle('err', !!isError)
  t.classList.add('show')
  clearTimeout(toastT)
  toastT = setTimeout(() => t.classList.remove('show'), 2600)
}
async function sendPrompt(text, button) {
  if (button) button.disabled = true
  try {
    const s = selected()
    const res = await fetch('/prompt', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text, session: s ? s.id : undefined }) })
    if (!res.ok) throw new Error(String(res.status))
    toast(s ? `Sent to Claude Code · ${s.label}` : 'Sent to Claude Code')
    return true
  } catch {
    toast('Not sent: the bridge does not answer. Run bun bridge/serve.ts.', true)
    return false
  } finally {
    if (button) button.disabled = false
  }
}

function liveTick(now) {
  const m = liveModel
  const busy = m.agents.some(a => a.endedAt === undefined)
  const wait = stage.querySelector('.wait')
  if (wait) wait.hidden = m.agents.length > 0
  if (liveView === 'svg') {
    // Like the mod: draw on each change, and every 2 s while agents run.
    if (liveChanged || lastSvg === 0 || (busy && now - lastSvg > 2000)) { paintSvg(m); lastSvg = now }
  } else if (now - lastFrame >= 60) {
    paintCells(m)
    lastFrame = now
  }
  liveChanged = false
  document.getElementById('clock').innerHTML = `live session · last update <i>${Math.max(0, Math.round((now - lastMsg) / 1000))}s</i> ago`
}

go(+(location.hash.slice(1)) || 0)
loop()
connect()
</script>
</body>
</html>
